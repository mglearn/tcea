<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<title>Share your LibVibe</title>
<style>
  :root{--navy:#0A3476;--navy-dark:#071F4A;--gold:#FCB040;--gold-light:#FDD17A;--teal:#0E6B8A;
        --off-white:#F7F8FC;--text:#1A1A2E;--muted:#5A6680;--border:#E2E7F5;--ok:#1f9d63;--err:#c2493f;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);background:var(--off-white);line-height:1.5}
  .wrap{max-width:680px;margin:0 auto;padding:1.4rem}
  header{background:linear-gradient(160deg,var(--navy),var(--navy-dark));color:#fff;border-radius:14px;padding:1.4rem 1.3rem;border-bottom:4px solid var(--gold)}
  header h1{margin:0;font-size:1.5rem}
  header p{margin:.4rem 0 0;color:#cdd7ef;font-size:.95rem}
  form{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.3rem;margin-top:1rem}
  label{display:block;font-weight:700;color:var(--navy);font-size:.9rem;margin:1rem 0 .3rem}
  label .req{color:var(--err)}
  .hint{font-weight:400;color:var(--muted);font-size:.82rem}
  input,select,textarea{width:100%;padding:.6rem .7rem;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.95rem;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #d9ecf2}
  textarea{resize:vertical;min-height:90px}
  textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;min-height:140px}
  .row{display:flex;gap:.8rem;flex-wrap:wrap}
  .row>div{flex:1;min-width:180px}
  .agree{display:flex;gap:.6rem;align-items:flex-start;margin-top:1.1rem;font-size:.9rem;color:var(--text)}
  .agree input{width:auto;margin-top:.25rem}
  .btn{margin-top:1.2rem;background:var(--gold);color:var(--navy);font-weight:800;border:0;border-radius:10px;padding:.8rem 1.4rem;font-size:1rem;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--gold-light)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;font-size:.92rem;display:none}
  .msg.ok{display:block;background:#e7f6ee;color:var(--ok);border:1px solid #b9e4cc}
  .msg.err{display:block;background:#fbe3e1;color:var(--err);border:1px solid #f3c2bd}
  .note{font-size:.82rem;color:var(--muted);margin-top:1rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Share your LibVibe</h1>
    <p>Built a library tool with a vibe-coding prompt? Submit it here. A librarian reviews every entry before anything is published — no logins, no spam.</p>
  </header>

  <form id="f" onsubmit="return false;">
    <div class="row">
      <div>
        <label>Your name <span class="req">*</span></label>
        <input id="name" aria-label="Your name *" required maxlength="120">
      </div>
      <div>
        <label>Email <span class="hint">(optional, for credit/follow-up)</span></label>
        <input aria-label="Email (optional, for credit/follow-up)" id="email" type="email" maxlength="160">
      </div>
    </div>

    <label>School / library <span class="hint">(optional)</span></label>
    <input id="school" aria-label="School / library (optional)" maxlength="160">

    <label>Solution title <span class="req">*</span></label>
    <input aria-label="Solution title *" id="title" required maxlength="120" placeholder="e.g. Genrefication Sorting Game">

    <div class="row">
      <div>
        <label>Grade band</label>
        <select id="grade">
          <option value="">Choose…</option>
          <option>Elementary (K–5)</option>
          <option>Middle (6–8)</option>
          <option>High (9–12)</option>
          <option>All ages / staff</option>
        </select>
      </div>
      <div>
        <label>Category</label>
        <select id="category">
          <option value="">Choose…</option>
          <option>Library skill</option>
          <option>Information literacy</option>
          <option>Research skills</option>
          <option>Reader advisory</option>
          <option>Creative literacy</option>
          <option>Engagement</option>
          <option>Promotion</option>
          <option>Operations</option>
          <option>Library event</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <label>One-line description <span class="req">*</span></label>
    <input aria-label="One-line description *" id="description" required maxlength="200" placeholder="What does it do, in one sentence?">

    <label>The starter prompt <span class="req">*</span> <span class="hint">— the prompt you pasted into the AI</span></label>
    <textarea id="prompt" class="code" required></textarea>

    <label>Your solution <span class="req">*</span> <span class="hint">— paste the full single-file HTML, OR give a link below</span></label>
    <textarea id="solutionHtml" class="code" placeholder="Paste your complete index.html here (one self-contained file)…"></textarea>

    <label>…or a link to your solution <span class="hint">(GitHub Pages, etc.)</span></label>
    <input aria-label="…or a link to your solution (GitHub Pages, etc.)" id="solutionLink" type="url" placeholder="https://…">

    <label class="agree">
      <input id="agree" type="checkbox">
      <span>This is my own work (or I have permission to share it), it contains no malicious or tracking code, and TCEA may review and publish it with credit.</span>
    </label>

    <button class="btn" id="submit" type="button" onclick="send()">Submit my LibVibe</button>
    <div class="msg" id="msg"></div>
    <p class="note">Large solutions? Host the HTML somewhere and paste the link instead of the full file.</p>
  </form>
</div>

<script>
  function val(id){ return document.getElementById(id).value; }
  function setMsg(t, ok){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); }
  function send(){
    var btn=document.getElementById('submit');
    var payload={
      name:val('name'), email:val('email'), school:val('school'), title:val('title'),
      grade:val('grade'), category:val('category'), description:val('description'),
      prompt:val('prompt'), solutionHtml:val('solutionHtml'), solutionLink:val('solutionLink'),
      agree:document.getElementById('agree').checked
    };
    if(!payload.name||!payload.title||!payload.description||!payload.prompt){ setMsg('Please fill in the required (*) fields.',false); return; }
    if(!payload.agree){ setMsg('Please check the agreement box.',false); return; }
    if(!payload.solutionHtml.trim() && !payload.solutionLink.trim()){ setMsg('Paste your solution HTML or add a link to it.',false); return; }
    btn.disabled=true; btn.textContent='Sending…'; setMsg('',true); document.getElementById('msg').className='msg';
    google.script.run
      .withSuccessHandler(function(){
        document.getElementById('f').reset();
        btn.disabled=false; btn.textContent='Submit my LibVibe';
        setMsg('Thank you! Your LibVibe was submitted for review. We’ll be in touch if we publish it.',true);
        window.scrollTo(0,document.body.scrollHeight);
      })
      .withFailureHandler(function(err){
        btn.disabled=false; btn.textContent='Submit my LibVibe';
        setMsg((err && err.message) ? err.message : 'Something went wrong — please try again.',false);
      })
      .submitLibVibe(payload);
  }
</script>
<script src="/tcea/licensing-footer.js" defer></script>
</body>
</html>
