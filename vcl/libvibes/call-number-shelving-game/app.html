<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelve It Right! · Call Number Shelving Game</title>
<meta name="description" content="A drag-to-order game for practicing Dewey and fiction shelf order. A LibVibes built example.">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A3476; --navy-dark:#071F4A; --gold:#FCB040; --gold-light:#FDD17A;
    --teal:#0E6B8A; --teal-pale:#D9ECF2; --white:#fff; --text:#1A1A2E;
    --good:#1f9d63; --bad:#d9534f; --wood1:#a9714b; --wood2:#8a5a39;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',sans-serif;color:var(--text);
    background:linear-gradient(160deg,#0A3476,#071F4A);
    min-height:100vh;padding:1.2rem;display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:640px}
  header{text-align:center;color:var(--white);margin-bottom:1.2rem}
  h1{font-family:'DM Serif Display',serif;font-size:2rem;line-height:1.1}
  h1 em{color:var(--gold);font-style:normal}
  .sub{color:var(--gold-light);font-size:.9rem;margin-top:.35rem}
  .panel{
    background:var(--white);border-radius:14px;padding:1.2rem 1.2rem 1.4rem;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  .modes{display:flex;gap:.5rem;margin-bottom:1rem}
  .mode-btn{
    flex:1;border:2px solid var(--border,#e2e7f5);background:#f3f6fc;color:var(--navy);
    font-weight:700;font-family:inherit;padding:.6rem;border-radius:10px;cursor:pointer;transition:.15s;
  }
  .mode-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .prompt-line{font-size:.92rem;color:var(--teal);font-weight:600;text-align:center;margin-bottom:.9rem}
  .shelf{
    background:linear-gradient(180deg,var(--wood1),var(--wood2));
    border-radius:10px;padding:.7rem;display:flex;flex-direction:column;gap:.55rem;
    border-bottom:10px solid #5d3a22;box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
  }
  .spine{
    display:flex;align-items:center;gap:.6rem;background:var(--spine,#3b7ea1);
    color:#fff;border-radius:7px;padding:.7rem .8rem;cursor:grab;
    box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .18s,box-shadow .15s;
    touch-action:none;user-select:none;
  }
  .spine.dragging{opacity:.6;cursor:grabbing;transform:scale(1.03)}
  .spine .grip{font-size:1.1rem;opacity:.8}
  .spine .label{font-family:'DM Mono',monospace;font-weight:600;font-size:1.05rem;flex:1}
  .spine .pos{font-size:.75rem;background:rgba(0,0,0,.25);padding:.15rem .5rem;border-radius:20px;min-width:1.7rem;text-align:center}
  .spine.correct{box-shadow:0 0 0 3px var(--good),0 3px 8px rgba(0,0,0,.25)}
  .spine.wrong{box-shadow:0 0 0 3px var(--bad),0 3px 8px rgba(0,0,0,.25);animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .arrows{display:flex;flex-direction:column;gap:2px}
  .arrows button{background:rgba(0,0,0,.22);border:0;color:#fff;border-radius:5px;width:26px;height:20px;cursor:pointer;font-size:.7rem;line-height:1}
  .arrows button:active{background:var(--gold);color:var(--navy)}
  .hint{display:none;font-size:.78rem;background:#fff6e3;border-left:3px solid var(--gold);color:#7a5a18;padding:.5rem .7rem;border-radius:0 6px 6px 0;margin-top:.5rem}
  .hint.show{display:block}
  .actions{display:flex;gap:.6rem;margin-top:1rem}
  .btn{flex:1;font-family:inherit;font-weight:700;padding:.75rem;border-radius:10px;cursor:pointer;border:0;transition:.15s}
  .btn-check{background:var(--gold);color:var(--navy)}
  .btn-check:hover{background:var(--gold-light)}
  .btn-new{background:#eef2fa;color:var(--navy);border:2px solid #d7e0f2}
  .scoreboard{display:flex;justify-content:space-between;margin-bottom:1rem;font-size:.9rem}
  .scoreboard b{color:var(--teal);font-size:1.25rem;font-family:'DM Serif Display',serif}
  .result-msg{text-align:center;font-weight:700;margin-top:.9rem;min-height:1.3rem;transition:.2s}
  .result-msg.win{color:var(--good)}
  .result-msg.lose{color:var(--bad)}
  footer{color:#9fb2da;font-size:.78rem;text-align:center;margin-top:1.3rem}
  footer a{color:var(--gold-light)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shelve It <em>Right!</em></h1>
    <div class="sub">Put the books in correct shelf order — drag, or use the ▲▼ arrows.</div>
  </header>

  <div class="panel">
    <div class="modes">
      <button class="mode-btn active" data-mode="dewey">📚 Dewey (Nonfiction)</button>
      <button class="mode-btn" data-mode="fiction">🔤 Fiction (A–Z)</button>
    </div>

    <div class="scoreboard">
      <span>Score: <b id="score">0</b></span>
      <span>Streak: <b id="streak">0</b></span>
    </div>

    <div class="prompt-line" id="prompt">Drag the spines into ascending Dewey order (smallest on top).</div>

    <div class="shelf" id="shelf"></div>
    <div class="hint" id="hint"></div>

    <div class="result-msg" id="resultMsg"></div>

    <div class="actions">
      <button class="btn btn-check" id="checkBtn">Check my shelf</button>
      <button class="btn btn-new" id="newBtn">New round</button>
    </div>
  </div>

  <footer>
    A <strong style="color:#fff">LibVibes</strong> built example · #6 Call Number Shelving Game ·
    <a href="../../libvibes.html">Back to LibVibes</a>
  </footer>
</div>

<script>
/* ===== EDIT ME: practice sets ===== */
const SETS = {
  dewey: [
    ["398.2","523.4","595.7","599.65","636.7"],
    ["595.7","595.789","595.79","599.2","599.65"],
    ["811.54","813.6","822.33","940.53","973.7"],
    ["004.6","005.13","006.7","025.04","070.4"],
    ["523.1","523.45","523.8","525.0","529.3"]
  ],
  fiction: [
    ["ADAMS","ALCOTT","ANDERSON","APPLEGATE","AUSTEN"],
    ["ROW","ROWE","ROWLING","ROY","RUIZ"],
    ["MARTIN","MARTINEZ","MASON","MAYER","MCBRIDE"],
    ["SMITH","SNICKET","SPINELLI","STEAD","STINE"],
    ["DICKENS","DICKINSON","DIONE","DOYLE","DUMAS"]
  ]
};
const SPINE_COLORS = ["#3b7ea1","#9b5ab5","#c2693b","#2e8b6f","#b5485f","#5a6bbf"];

let mode = "dewey";
let order = [];           // current spine objects in display order
let score = 0, streak = 0;

const shelf = document.getElementById("shelf");
const hintEl = document.getElementById("hint");
const resultMsg = document.getElementById("resultMsg");
const promptEl = document.getElementById("prompt");

function sortKey(s){ return mode === "dewey" ? parseFloat(s.label) : s.label; }
function compare(a,b){ const ka=sortKey(a),kb=sortKey(b); return ka<kb?-1:ka>kb?1:0; }

function newRound(){
  const pool = SETS[mode];
  const set = pool[Math.floor(Math.random()*pool.length)];
  // scramble until not already sorted
  let arr;
  do { arr = [...set].sort(()=>Math.random()-0.5); }
  while (arr.join() === [...set].sort((a,b)=> mode==="dewey"? a-b : a<b?-1:1).join());
  order = arr.map((label,i)=>({label,color:SPINE_COLORS[i%SPINE_COLORS.length]}));
  promptEl.textContent = mode === "dewey"
    ? "Drag the spines into ascending Dewey order (smallest number on top)."
    : "Drag the spines into alphabetical order by author (A on top).";
  resultMsg.textContent=""; resultMsg.className="result-msg";
  hintEl.className="hint";
  render();
}

function render(){
  shelf.innerHTML="";
  order.forEach((s,idx)=>{
    const el=document.createElement("div");
    el.className="spine"; el.style.setProperty("--spine",s.color);
    el.dataset.idx=idx;
    el.innerHTML=`
      <span class="grip">⠿</span>
      <span class="label">${s.label}</span>
      <span class="arrows">
        <button data-dir="-1" aria-label="Move up">▲</button>
        <button data-dir="1" aria-label="Move down">▼</button>
      </span>
      <span class="pos">${idx+1}</span>`;
    shelf.appendChild(el);
  });
  bindDrag();
}

/* ---- arrow move ---- */
shelf.addEventListener("click",e=>{
  const b=e.target.closest("button[data-dir]"); if(!b) return;
  const idx=+b.closest(".spine").dataset.idx, dir=+b.dataset.dir, ni=idx+dir;
  if(ni<0||ni>=order.length) return;
  [order[idx],order[ni]]=[order[ni],order[idx]];
  render();
});

/* ---- pointer drag reorder ---- */
let dragIdx=null;
function bindDrag(){
  shelf.querySelectorAll(".spine").forEach(el=>{
    el.addEventListener("pointerdown",e=>{
      if(e.target.closest("button")) return;
      dragIdx=+el.dataset.idx; el.classList.add("dragging");
    });
  });
}
document.addEventListener("pointermove",e=>{
  if(dragIdx===null) return;
  const target=document.elementFromPoint(e.clientX,e.clientY);
  const overEl=target&&target.closest(".spine");
  if(!overEl) return;
  const overIdx=+overEl.dataset.idx;
  if(overIdx!==dragIdx){
    const moved=order.splice(dragIdx,1)[0];
    order.splice(overIdx,0,moved);
    dragIdx=overIdx; render();
    shelf.querySelector(`.spine[data-idx="${overIdx}"]`).classList.add("dragging");
  }
});
document.addEventListener("pointerup",()=>{ dragIdx=null;
  shelf.querySelectorAll(".dragging").forEach(el=>el.classList.remove("dragging")); });

/* ---- check ---- */
document.getElementById("checkBtn").addEventListener("click",()=>{
  const correctOrder=[...order].sort(compare);
  let allRight=true, firstWrong=null;
  shelf.querySelectorAll(".spine").forEach((el,idx)=>{
    el.classList.remove("correct","wrong");
    const shouldBe = correctOrder.findIndex(s=>s.label===order[idx].label)+1;
    el.querySelector(".pos").textContent = (shouldBe===idx+1)? "✓" : "→"+shouldBe;
    if(shouldBe===idx+1){ el.classList.add("correct"); }
    else { el.classList.add("wrong"); allRight=false; if(firstWrong===null) firstWrong=order[idx]; }
  });
  if(allRight){
    score++; streak++; resultMsg.textContent="✅ Perfect shelf! Nicely done."; resultMsg.className="result-msg win";
    hintEl.className="hint";
  } else {
    streak=0; resultMsg.textContent="Not quite — check the ones marked in red."; resultMsg.className="result-msg lose";
    hintEl.className="hint show";
    hintEl.innerHTML = mode==="dewey"
      ? `<b>Why?</b> Nonfiction shelves by number, smallest first. Compare digit by digit: <b>${firstWrong.label}</b> goes where its value fits in order.`
      : `<b>Why?</b> Fiction shelves alphabetically by the author's last name, letter by letter (so ROW comes before ROWE, which comes before ROWLING).`;
  }
  document.getElementById("score").textContent=score;
  document.getElementById("streak").textContent=streak;
});

document.getElementById("newBtn").addEventListener("click",newRound);
document.querySelectorAll(".mode-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".mode-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); mode=b.dataset.mode; newRound();
  });
});

newRound();
</script>
<script src="../../libvibes-notice.js"></script>
</body>
</html>
