<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="site.title">Getting to Know You</title>
  <meta name="description" data-i18n-content="site.tagline"
        content="Subject-based Getting to Know You interest-inventory worksheets for Grades K–12, in English, Spanish, and Vietnamese.">
  <link rel="stylesheet" href="assets/styles.css">
  <!-- i18n engine + dictionary load before the gallery app -->
  <script src="assets/i18n.js" defer></script>
  <script src="assets/gtky-i18n.js" defer></script>
  <script src="assets/gtky-manifest.js" defer></script>
  <script src="assets/gtky-app.js" defer></script>
</head>
<body>

  <!-- Language switcher (auto-populated by the i18n engine) -->
  <div class="langbar">
    <span class="globe" aria-hidden="true">🌐</span>
    <span class="lang-label" data-i18n="lang.label">Language</span>
    <div data-i18n-picker></div>
  </div>

  <header class="hero">
    <div class="hero-inner">
      <h1 class="visually-hidden" data-i18n="site.title">Getting to Know You</h1>
      <img class="hero-banner" src="gtky_hero_banner.png"
           data-i18n-alt="site.tagline"
           alt="Getting to Know You — a K–12 interest-inventory worksheet collection in Science, Math, ELA, Social Studies and Fine Arts, in English, Spanish, and Vietnamese.">
      <nav class="hero-nav">
        <a class="primary" href="#gallery-section" data-i18n="nav.gallery">Worksheets</a>
        <a href="research.html" data-i18n="nav.research">The Research</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="gallery-section" aria-labelledby="gallery-h">
      <h2 id="gallery-h" class="section-title" data-i18n="nav.gallery">Worksheets</h2>

      <div class="filters" role="group" aria-labelledby="gallery-h">
        <div class="field">
          <label for="filter-band" data-i18n="filter.band">Grade band</label>
          <select id="filter-band"></select>
        </div>
        <div class="field">
          <label for="filter-subject" data-i18n="filter.subject">Subject</label>
          <select id="filter-subject"></select>
        </div>
        <button id="filter-reset" data-i18n="filter.reset">Reset filters</button>
        <div class="spacer"></div>
        <div class="count" id="gallery-count">—</div>
      </div>

      <p class="gallery-note" id="gallery-note"></p>
      <div id="gallery"></div>

      <p class="research-cta">
        <a href="research.html" data-i18n="research.cta">Read the research behind these worksheets →</a>
      </p>
    </section>
  </main>

  <footer>
    <p class="built" data-i18n="footer.built">Interest inventories for Grades K–12 · English · Español · Tiếng Việt</p>
    <p data-i18n="footer.license">Worksheets © Miguel Guhlin, licensed CC BY-SA. Site for TCEA.</p>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="lightbox-bar">
      <a id="lightbox-dl-png" href="#" download>↓ PNG</a>
      <a id="lightbox-dl-pdf" href="#" download>↓ PDF</a>
      <button id="lightbox-close" type="button" data-i18n="lightbox.close">Close</button>
    </div>
    <img id="lightbox-img" src="" alt="">
  </div>

</body>
</html>
