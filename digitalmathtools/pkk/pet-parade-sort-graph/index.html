<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Pet Parade Sort and Graph — PreK &amp; Kindergarten</title>
<meta name="description" content="Sort friendly pets by color, type, size, or habitat, explain the rule, count groups, build a picture graph, and answer questions about the data. No accounts, no data collected, works offline.">
<style>
  :root{
    --grape:#5b3fa5;--grape-d:#3f2a78;--sun:#ffcb3d;--sun-d:#e0a400;
    --paper:#f6f4fc;--ink:#1c1730;--ink-soft:#5b5470;--card:#fff;--line:#e2dcf1;
    --ok:#2f8f4e;--ok-bg:#e5f6ea;--warn:#c85a12;--warn-bg:#fdeede;--sky:#dfeafd;
    --focus:#0b6bcb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse 60% 45% at 88% -5%,rgba(255,203,61,.18)0,transparent 60%),
    radial-gradient(ellipse 55% 45% at 0% 100%,rgba(91,63,165,.12)0,transparent 60%),var(--paper);
    min-height:100vh;line-height:1.5;overflow-x:hidden}
  a{color:var(--grape-d)}
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

  .topbar{position:sticky;top:0;z-index:40;background:var(--grape);color:#fff;
    display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;
    box-shadow:0 3px 12px rgba(30,23,48,.18)}
  .topbar .brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-inline-end:auto}
  .topbar .brand .logo{font-size:1.4rem}
  .tbtn{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.35);
    border-radius:10px;padding:9px 14px;font-weight:800;font-size:.9rem;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:7px;min-height:44px}
  .tbtn:hover{background:rgba(255,255,255,.26)}
  .tbtn.sun{background:var(--sun);color:var(--grape-d);border-color:var(--sun-d)}
  .tbtn.sun:hover{background:var(--sun-d);color:#fff}
  .langwrap{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.35);border-radius:10px;padding:2px 8px;min-height:44px}
  .langwrap .glb{font-size:1.1rem}
  #langSel{background:transparent;color:#fff;border:none;font-family:inherit;font-weight:800;
    font-size:.9rem;padding:6px 2px;cursor:pointer;min-height:36px}
  #langSel option{color:#1c1730;background:#fff}

  .wrap{max-width:1060px;margin:0 auto;padding:20px 16px 40px}

  .direction{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);
    border-inline-start:8px solid var(--sun);border-radius:14px;padding:12px 14px;margin:0 0 18px;
    box-shadow:0 3px 10px rgba(30,23,48,.06)}
  .direction .dtxt{font-weight:700;font-size:1.05rem;color:var(--ink)}
  .speaker{flex:none;background:var(--grape);color:#fff;border:none;border-radius:50%;
    width:48px;height:48px;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .speaker:hover{background:var(--grape-d)}
  .speaker[hidden]{display:none}

  h1{font-weight:800;font-size:clamp(1.8rem,5vw,2.7rem);color:var(--grape);line-height:1.05}
  .lede{color:var(--ink-soft);font-weight:600;max-width:640px;margin:10px 0 0}

  h2.sec{color:var(--grape);font-size:1.15rem;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  h2.sec::after{content:"";flex:1;height:2px;background:var(--line)}

  .modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .modecard{display:flex;flex-direction:column;align-items:flex-start;text-align:start;background:var(--card);
    border:2px solid var(--line);border-top:6px solid var(--accent,var(--grape));border-radius:16px;
    padding:18px;cursor:pointer;transition:transform .16s,box-shadow .2s,border-color .16s;
    box-shadow:0 3px 10px rgba(30,23,48,.05);min-height:150px}
  .modecard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(30,23,48,.12)}
  .modecard .ico{font-size:2.2rem;line-height:1;margin-bottom:8px}
  .modecard h3{color:var(--grape);font-size:1.2rem;margin-bottom:6px}
  .modecard p{font-weight:600;color:var(--ink-soft);font-size:.9rem}

  .btn{background:var(--grape);color:#fff;border:2px solid var(--grape-d);border-radius:12px;
    padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer;min-height:48px;
    display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:var(--grape-d)}
  .btn.sun{background:var(--sun);color:var(--grape-d);border-color:var(--sun-d)}
  .btn.ghost{background:#fff;color:var(--grape);border-color:var(--line)}
  .btn.ghost:hover{background:#f0ebfb}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  .panel{background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 3px 10px rgba(30,23,48,.05);margin-bottom:16px}

  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .chip{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:#fff;
    border:2px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:800;
    color:var(--ink);min-width:96px;min-height:76px;justify-content:center}
  .chip .ci{font-size:1.6rem;line-height:1}
  .chip:hover{border-color:var(--grape)}
  .chip[aria-pressed="true"]{background:var(--grape);color:#fff;border-color:var(--grape-d)}

  .tray{display:flex;flex-wrap:wrap;gap:12px;background:var(--sky);border:2px dashed #a9c1ef;
    border-radius:16px;padding:14px;min-height:120px;align-content:flex-start;margin-bottom:16px}
  .tray .trayhint{align-self:center;color:#4a5f86;font-weight:700;margin:auto}
  .bins{display:grid;gap:14px}
  .bins.n2{grid-template-columns:repeat(2,1fr)}
  .bins.n3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:620px){.bins.n3,.bins.n2{grid-template-columns:1fr}}
  .bin{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;display:flex;
    flex-direction:column;min-height:150px;transition:border-color .12s,background .12s}
  .bin.over{border-color:var(--grape);background:#f2ecfd}
  .bin .binhead{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;
    padding-bottom:10px;margin-bottom:8px;border-bottom:2px solid var(--line)}
  .bin .binhead .swatch{width:26px;height:26px;border-radius:7px;border:2px solid rgba(0,0,0,.2);flex:none}
  .bin .binhead .bi{font-size:1.5rem;line-height:1}
  .bin-items{display:flex;flex-wrap:wrap;gap:10px;flex:1;align-content:flex-start}
  .bin-count{margin-top:8px;font-weight:800;color:var(--grape);font-size:.95rem;text-align:center;
    background:#f0ebfb;border-radius:9px;padding:5px}

  .piece{position:relative;width:84px;height:96px;background:#fff;border:2px solid var(--line);
    border-radius:14px;cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;
    padding:4px;transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:0 2px 6px rgba(30,23,48,.08)}
  .piece:hover{box-shadow:0 6px 14px rgba(30,23,48,.16)}
  .piece.dragging{cursor:grabbing;box-shadow:0 16px 34px rgba(30,23,48,.3);transform:scale(1.06)}
  .piece svg{width:100%;height:64px;flex:none}
  .piece .cap{font-size:.66rem;font-weight:800;color:var(--ink-soft);text-align:center;line-height:1.05}
  .piece.right{border-color:var(--ok);background:var(--ok-bg)}
  .piece.wrong{border-color:var(--warn);background:var(--warn-bg);animation:jiggle .4s}
  @keyframes jiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .piece .badge{position:absolute;top:-9px;inset-inline-end:-9px;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;color:#fff}
  .piece.right .badge{background:var(--ok)}
  .piece.wrong .badge{background:var(--warn)}

  .feedback{display:flex;align-items:flex-start;gap:12px;border-radius:14px;padding:14px;margin:16px 0 0;
    font-weight:700;border:2px solid var(--line);background:#fff}
  .feedback .fico{font-size:1.5rem;flex:none;line-height:1.2}
  .feedback.ok{background:var(--ok-bg);border-color:#a8dcb8;color:#1f6b3a}
  .feedback.tip{background:var(--warn-bg);border-color:#f0c99a;color:#8a4210}
  .feedback[hidden]{display:none}
  .feedback .speaker{width:40px;height:40px;font-size:1.1rem}

  .choices{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .choice{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-weight:800;
    font-size:1.05rem;cursor:pointer;min-height:56px;display:inline-flex;align-items:center;gap:10px;color:var(--ink)}
  .choice:hover{border-color:var(--grape)}
  .choice .cico{font-size:1.4rem}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok);color:#1f6b3a}
  .choice.incorrect{background:var(--warn-bg);border-color:var(--warn);color:#8a4210}
  .choice:disabled{cursor:default}

  .graph{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;overflow-x:auto}
  .grow{display:grid;grid-template-columns:130px 1fr 54px;align-items:center;gap:10px;padding:8px 0;
    border-bottom:2px dashed var(--line)}
  .grow:last-child{border-bottom:none}
  .glabel{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.98rem}
  .glabel .swatch{width:22px;height:22px;border-radius:6px;border:2px solid rgba(0,0,0,.2);flex:none}
  .glabel .gi{font-size:1.4rem;line-height:1}
  .gtrack{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-content:center}
  .gcell{width:40px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:9px;
    background:#f6f4fc;border:2px solid var(--line);opacity:.28;transition:opacity .2s,transform .2s}
  .gcell svg{width:34px;height:34px}
  .gcell .emo{font-size:1.5rem}
  .gcell.on{opacity:1}
  .gcell.pop{animation:pop .35s}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .gtotal{font-weight:900;font-size:1.3rem;color:var(--grape);text-align:center;background:#f0ebfb;
    border-radius:9px;padding:4px}

  .field{margin-bottom:16px}
  .field>label.flabel{display:block;font-weight:800;margin-bottom:8px;color:var(--grape-d)}
  .segrow{display:flex;gap:8px;flex-wrap:wrap}
  .seg{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;
    cursor:pointer;color:var(--ink);min-height:46px}
  .seg[aria-pressed="true"]{background:var(--grape);color:#fff;border-color:var(--grape-d)}
  .switch{display:inline-flex;align-items:center;gap:10px;font-weight:800;cursor:pointer}
  .switch input{width:22px;height:22px}
  input[type=text],input[type=number]{font-family:inherit;font-weight:700;font-size:1rem;padding:10px 12px;
    border:2px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
  input:focus{outline:none;border-color:var(--grape)}

  .catrow{display:grid;grid-template-columns:64px 1fr 110px auto;gap:10px;align-items:center;margin-bottom:10px}
  .catrow .emopick{font-size:1.8rem;text-align:center;border:2px solid var(--line);border-radius:12px;
    background:#fff;padding:6px;cursor:pointer;min-height:52px}
  @media(max-width:560px){.catrow{grid-template-columns:56px 1fr;grid-auto-rows:auto}}

  footer{border-top:2px solid var(--line);margin-top:36px;padding:20px 16px;text-align:center;
    color:var(--ink-soft);font-weight:700;font-size:.9rem}
  footer a{color:var(--grape);font-weight:800}
  footer .dot{margin:0 8px;color:var(--line)}

  .standards{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
  .standards summary{font-weight:800;color:var(--grape);cursor:pointer}
  .standards p{font-weight:600;color:var(--ink-soft);font-size:.86rem;margin-top:8px}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand"><span class="logo" aria-hidden="true">🐾</span> <span id="brandTxt"></span></span>

    <select id="langSel" aria-label="Language / Idioma / 语言"></select></label>
  <button class="tbtn" id="menuBtn" type="button"></button>
  <button class="tbtn" id="settingsBtn" type="button"></button>
  <a class="tbtn sun" id="homeLink" href="../../index.html"></a>
</div>

<main class="wrap" id="app"></main>

<footer>
  <span id="footTag"></span>
  <div style="margin-top:6px">
    <a href="../../index.html" id="footHome"></a><span class="dot">•</span><a href="../../policy.html" id="footPriv"></a>
  </div>
</footer>

function t(key, p){
  let s = (I18N[L] && I18N[L][key]!=null) ? I18N[L][key] : (I18N.en[key]!=null?I18N.en[key]:key);
  if(p) for(const k in p) s = s.split('{'+k+'}').join(p[k]);

}

}

/* ---------------- Speech ---------------- */
const SPEECH_OK = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
if(SPEECH_OK){ try{ speechSynthesis.onvoiceschanged = function(){}; }catch(e){} }
function pickVoice(lang){
  const vs = (SPEECH_OK ? speechSynthesis.getVoices() : []) || [];
  const base = lang.split('-')[0].toLowerCase();
  return vs.find(v=>v.lang && v.lang.toLowerCase()===lang.toLowerCase())
      || vs.find(v=>v.lang && v.lang.toLowerCase().replace('_','-').startsWith(base)) || null;
}
function speak(text){
  if(!SPEECH_OK || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = SPEECH_LANG[L] || 'en-US'; u.rate = 0.95; u.pitch = 1.05;
    const v = pickVoice(u.lang); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakerBtn(getText){
  const b = document.createElement('button');
  b.className = 'speaker'; b.type = 'button';
  b.setAttribute('aria-label', t('aria.read')); b.textContent = '🔊';
  if(!SPEECH_OK) b.hidden = true;
  b.addEventListener('click', ()=> speak(typeof getText==='function'?getText():getText));
  return b;
}

/* ---------------- Color helpers ---------------- */
function darken(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.max(0,Math.round(r*(1-amt))); g=Math.max(0,Math.round(g*(1-amt))); b=Math.max(0,Math.round(b*(1-amt)));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------------- Item / rule model ---------------- */
let uid = 0;
function makeItem(type,color,size){
  const habitat = (typeMap()===ANIMALS) ? ANIMALS[type].habitat : null;
  return { id:'i'+(uid++), type, color, size, habitat };
}
function categoryOf(item, attr){
  if(attr==='color') return item.color;
  if(attr==='type') return item.type;
  if(attr==='size') return item.size;
  if(attr==='habitat') return item.habitat;
  return null;
}
function attrIcon(attr){ return {color:'🎨',type:'🐾',size:'📏',habitat:'🏡'}[attr]; }
function catInfo(attr, val){
  if(attr==='color') return {label:colorLabel(val), swatch:COLORS[val].hex};
  if(attr==='size')  return {label:sizeLabel(val), emoji:SIZES[val].icon};
  if(attr==='habitat')return {label:habitatLabel(val), emoji:HABITATS[val].icon};
  if(attr==='type')  return {label:typeLabel(val), art:val};
  return {label:val};
}
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function uniq(a){ return [...new Set(a)]; }
function valuesFor(attr){
  if(attr==='color') return Object.keys(COLORS);
  if(attr==='size')  return ['small','big'];
  if(attr==='habitat') return ['land','water'];
  if(attr==='type')  return Object.keys(typeMap());
  return [];
}
function catCountFor(attr){ return (attr==='size'||attr==='habitat') ? 2 : SET.numCats; }
function buildInstance(attr){
  const tm = typeMap();
  const nCats = catCountFor(attr);
  const cats = shuffle(valuesFor(attr).slice()).slice(0, nCats);
  const items = [];
  const maxPer = Math.max(2, Math.min(SET.maxPer, 10));
  cats.forEach(cv=>{
    const n = 2 + Math.floor(Math.random()*(maxPer-1));
    for(let k=0;k<n;k++){
      let type,color,size;
      if(attr==='type'){ type=cv; color=rnd(Object.keys(COLORS)); size=rnd(['small','big']); }
      else if(attr==='color'){ type=rnd(Object.keys(tm)); color=cv; size=rnd(['small','big']); }
      else if(attr==='size'){ type=rnd(Object.keys(tm)); color=rnd(Object.keys(COLORS)); size=cv; }
      else if(attr==='habitat'){ type=rnd(Object.keys(ANIMALS).filter(x=>ANIMALS[x].habitat===cv)); color=rnd(Object.keys(COLORS)); size=rnd(['small','big']); }
      items.push(makeItem(type,color,size));
    }
  });
  return { attr, cats, items:shuffle(items) };
}

/* ---------------- Drag engine ---------------- */
let drag=null, lastOverBin=null;
function makeDraggable(el){ el.addEventListener('pointerdown', pdown); }
function pdown(e){
  if(e.pointerType==='mouse' && e.button!==0) return;
  const el=e.currentTarget; e.preventDefault();
  const r=el.getBoundingClientRect();
  drag={el, offX:e.clientX-r.left, offY:e.clientY-r.top, home:el.parentNode, next:el.nextSibling};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  el.classList.add('dragging');
  el.style.width=r.width+'px'; el.style.height=r.height+'px';
  el.style.position='fixed'; el.style.margin='0'; el.style.zIndex='9999'; el.style.pointerEvents='none';
  document.body.appendChild(el); pmoveTo(e.clientX,e.clientY);
  el.addEventListener('pointermove', pmove);
  el.addEventListener('pointerup', pup);
  el.addEventListener('pointercancel', pup);
}
function pmoveTo(x,y){ drag.el.style.left=(x-drag.offX)+'px'; drag.el.style.top=(y-drag.offY)+'px'; }
function binAt(x,y){ const el=document.elementFromPoint(x,y); return el?el.closest('.bin'):null; }
function pmove(e){
  if(!drag)return; pmoveTo(e.clientX,e.clientY);
  const b=binAt(e.clientX,e.clientY);
  if(b!==lastOverBin){ if(lastOverBin)lastOverBin.classList.remove('over'); if(b)b.classList.add('over'); lastOverBin=b; }
}
function pup(e){
  if(!drag)return; const el=drag.el; const b=binAt(e.clientX,e.clientY);
  if(lastOverBin){ lastOverBin.classList.remove('over'); lastOverBin=null; }
  el.removeEventListener('pointermove',pmove); el.removeEventListener('pointerup',pup); el.removeEventListener('pointercancel',pup);
  el.style.position=''; el.style.left=''; el.style.top=''; el.style.width=''; el.style.height=''; el.style.margin=''; el.style.zIndex=''; el.style.pointerEvents='';
  el.classList.remove('dragging');
  if(b && b.__itemsBox){ b.__itemsBox.appendChild(el); onDrop(el,b); }
  else if(drag.home){ drag.home.insertBefore(el, drag.next); onDrop(el, drag.home.closest('.bin')); }
  drag=null;
}
function enablePieceKeys(el){
  el.addEventListener('keydown', ev=>{
    if(!ACTIVE || !ACTIVE.bins) return;
    if(/^[1-9]$/.test(ev.key)){
      const b=ACTIVE.bins[parseInt(ev.key,10)-1];
      if(b){ ev.preventDefault(); b.__itemsBox.appendChild(el); onDrop(el,b); el.focus(); }
    } else if(ev.key==='0' || ev.key==='Home'){
      if(ACTIVE.tray){ ev.preventDefault(); ACTIVE.tray.appendChild(el); onDrop(el,null); el.focus(); }
    }
  });
}
let ACTIVE=null;
function onDrop(el,bin){ if(ACTIVE && ACTIVE.onDrop) ACTIVE.onDrop(el,bin); }

/* ---------------- MODE 2: Guess My Rule ---------------- */
function ruleSeparates(inst, attr){
  const binOf={}; inst.cats.forEach((c,i)=>binOf[c]=i);
  const groups=inst.cats.map(()=>[]);
  inst.items.forEach(it=>groups[binOf[categoryOf(it,inst.attr)]].push(it));
  const seen=new Set();
  for(const g of groups){
    if(!g.length) return false;
    const v=categoryOf(g[0],attr);
    if(v==null) return false;
    if(!g.every(it=>categoryOf(it,attr)===v)) return false;
    if(seen.has(v)) return false; seen.add(v);
  }
  return true;
}
function uniqueRuleInstance(){
  const candidates=availableAttrs();
  for(let tries=0; tries<200; tries++){
    const target=rnd(candidates);
    const inst=buildInstance(target);
    const perfect=candidates.filter(a=>ruleSeparates(inst,a));
    if(perfect.length===1 && perfect[0]===target) return inst;
  }
  return buildInstance('color');
}

    const ln=document.createElement('span'); ln.textContent=info.label; lab.appendChild(ln);
    const track=document.createElement('div'); track.className='gtrack';
    for(let k=0;k<count;k++){

    grow.__tot=tot; grow.__count=count; grow.__cells=[...track.children]; grow.__label=info.label;
  });
  host.appendChild(g);
  if(animate){
    const rows=[...g.querySelectorAll('.grow')]; let ri=0;
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    (function doRow(){
      if(ri>=rows.length){ afterGraph(host,attr,cats); return; }
      const r=rows[ri]; let ci=0; speak(t('graph.counting',{group:r.__label}));
      (function step(){
        if(ci>=r.__cells.length){ r.__tot.textContent=r.__count; ri++; setTimeout(doRow, reduce?10:350); return; }
        r.__cells[ci].classList.add('on','pop'); ci++; r.__tot.textContent=ci; setTimeout(step, reduce?10:400);
      })();
    })();
  } else { afterGraph(host,attr,cats); }
}
function afterGraph(host, attr, cats){
  if(!SET.graphQ) return;
  if(host.querySelector('.gq')) return;
  const box=document.createElement('div'); box.className='panel gq'; box.style.marginTop='16px'; host.appendChild(box);
  askGraphQuestion(box, attr, cats);
}
function numChoices(n){
  const set=new Set([n]);
  while(set.size<3){ const d=n+(Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*2)); if(d>=0) set.add(d); if(n<2&&set.size<3) set.add(n+set.size); }
  return [...set].map(String);
}
function askGraphQuestion(box, attr, cats){
  box.innerHTML='';
  const data=cats.map(c=>({ label:(c.info||catInfo(attr,c.val)).label, count:c.items?c.items.length:c.count }));
  const counts=data.map(d=>d.count); const max=Math.max(...counts), min=Math.min(...counts);
  const maxes=data.filter(d=>d.count===max), mins=data.filter(d=>d.count===min);
  const anyEqual=new Set(counts).size < counts.length;
  const qs=[];
  if(maxes.length===1) qs.push({ q:t('gq.more.q'), say:t('gq.more.say'), correct:maxes[0].label, choices:data.map(d=>d.label), why:()=>t('why.more',{group:maxes[0].label,n:max}) });
  if(mins.length===1 && counts.length>1) qs.push({ q:t('gq.fewer.q'), say:t('gq.fewer.say'), correct:mins[0].label, choices:data.map(d=>d.label), why:()=>t('why.fewer',{group:mins[0].label,n:min}) });
  const pick=rnd(data);
  qs.push({ q:t('gq.howmany.q',{group:pick.label}), say:t('gq.howmany.say',{group:pick.label}), correct:String(pick.count), choices:numChoices(pick.count), why:()=>t('why.howmany',{group:pick.label,n:pick.count}) });
  qs.push({ q:t('gq.equal.q'), say:t('gq.equal.say'), correct:anyEqual?t('answer.yes'):t('answer.no'), choices:[t('answer.yes'),t('answer.no')], why:()=> anyEqual?t('why.equalYes'):t('why.equalNo') });
  qs.push({ q:t('gq.onemore.q',{group:pick.label}), say:t('gq.onemore.say',{group:pick.label}), correct:String(pick.count+1), choices:numChoices(pick.count+1), why:()=>t('why.onemore',{n:pick.count,n1:pick.count+1}) });
  const chosen=rnd(qs);
  const h=document.createElement('div'); h.style.display='flex'; h.style.alignItems='center'; h.style.gap='10px';
  h.appendChild(speakerBtn(()=>chosen.say));
  const qt=document.createElement('b'); qt.style.fontSize='1.1rem'; qt.textContent=chosen.q; h.appendChild(qt); box.appendChild(h);
  const ch=document.createElement('div'); ch.className='choices'; box.appendChild(ch);
  const fb=feedbackBox(); box.appendChild(fb);
  shuffle(uniq(chosen.choices)).forEach(opt=>{
    const b=document.createElement('button'); b.className='choice'; b.type='button'; b.textContent=opt;
    b.addEventListener('click',()=>{
      ch.querySelectorAll('.choice').forEach(x=>x.disabled=true);
      if(opt===chosen.correct){ b.classList.add('correct'); fb.show('ok','✅', t('gq.correct',{why:chosen.why()})); }
      else { b.classList.add('incorrect'); const cc=[...ch.children].find(x=>x.textContent===chosen.correct); if(cc) cc.classList.add('correct');
        fb.show('tip','💡', t('gq.answerIs',{a:chosen.correct, why:chosen.why()})); }
    });
    ch.appendChild(b);
  });
  const nq=document.createElement('button'); nq.className='btn ghost'; nq.type='button'; nq.textContent='❓ '+t('gq.another'); nq.style.marginTop='14px';
  nq.addEventListener('click',()=>askGraphQuestion(box,attr,cats)); box.appendChild(nq);
  speak(chosen.say);
}

/* ---------------- MODE 5: Read the Graph ---------------- */
function modeRead(){
  CURRENT=modeRead; clearApp(); ACTIVE=null;
  setDirection(APP, t('dir.read'));
  const host=document.createElement('div'); APP.appendChild(host); newRead(host);
}
function newRead(host){
  host.innerHTML='';
  const attr=rnd(availableAttrs()); const nCats=catCountFor(attr);
  const cats=shuffle(valuesFor(attr).slice()).slice(0,nCats).map(v=>{
    const count=1+Math.floor(Math.random()*Math.min(10,Math.max(3,SET.maxPer)));
    const items=[];
    for(let k=0;k<count;k++){
      let type,color,size;
      if(attr==='type'){ type=v; color=rnd(Object.keys(COLORS)); size='big'; }
      else if(attr==='color'){ type=rnd(Object.keys(typeMap())); color=v; size='big'; }
      else if(attr==='size'){ type=rnd(Object.keys(typeMap())); color=rnd(Object.keys(COLORS)); size=v; }
      else { type=rnd(Object.keys(ANIMALS).filter(x=>ANIMALS[x].habitat===v)); color=rnd(Object.keys(COLORS)); size='big'; }
      items.push(makeItem(type,color,size));
    }
    return {attr, val:v, items};
  });
  const graphHost=document.createElement('div'); host.appendChild(graphHost);
  buildGraphView(graphHost, attr, cats, false);
  if(!graphHost.querySelector('.gq')){ const box=document.createElement('div'); box.className='panel gq'; box.style.marginTop='16px'; graphHost.appendChild(box); askGraphQuestion(box, attr, cats); }
  const row=document.createElement('div'); row.className='btnrow';
  const nb=document.createElement('button'); nb.className='btn ghost'; nb.type='button'; nb.textContent='🔁 '+t('read.new');
  nb.addEventListener('click',()=>newRead(host)); row.appendChild(nb); host.appendChild(row);
}

/* ---------------- Class Question ---------------- */
const CLASS_TEMPLATES={
  fruit:{key:'fruit', emojis:['🍎','🍌','🍇']},
  school:{key:'school', emojis:['🚌','🚗','🚶']},
  center:{key:'center', emojis:['🧱','📚','🎨']},
};
function modeClass(){
  CURRENT=modeClass; clearApp(); ACTIVE=null;
  setDirection(APP, t('dir.class'));
  const p=document.createElement('div'); p.className='panel'; p.innerHTML='<b>'+t('class.pick')+'</b>';
  const chips=document.createElement('div'); chips.className='chips';
  Object.keys(CLASS_TEMPLATES).forEach(k=>{
    const tpl=CLASS_TEMPLATES[k];
    const c=document.createElement('button'); c.className='chip'; c.type='button';
    c.innerHTML=`<span class="ci">${tpl.emojis[0]}</span>${t('tmpl.'+k+'.title')}`;
    c.addEventListener('click',()=>fillTemplate(k)); chips.appendChild(c);
  });
  p.appendChild(chips); APP.appendChild(p);

  const form=document.createElement('div'); form.className='panel';
  const f1=document.createElement('div'); f1.className='field';
  const lbl=document.createElement('label'); lbl.className='flabel'; lbl.setAttribute('for','cqTitle'); lbl.textContent=t('class.titleLabel');
  const ti=document.createElement('input'); ti.type='text'; ti.id='cqTitle'; ti.style.width='100%'; ti.style.maxWidth='420px'; ti.placeholder=t('class.titlePh'); ti.value=t('tmpl.fruit.title');
  f1.append(lbl,ti); form.appendChild(f1);
  const rowsHost=document.createElement('div'); form.appendChild(rowsHost); APP.appendChild(form);

  const EMOJIS=['⭐','🍎','🍌','🍇','🚌','🚗','🚶','🚲','🧱','📚','🎨','🐱','🐶','🐟','🌟','❤️','🔵','🟢'];
  function rowFor(label,emoji,count){
    const r=document.createElement('div'); r.className='catrow';
    const em=document.createElement('button'); em.type='button'; em.className='emopick'; em.textContent=emoji||'⭐'; em.title=t('class.changePic'); em.setAttribute('aria-label',t('class.changePic'));
    em.addEventListener('click',()=>{ let i=EMOJIS.indexOf(em.textContent); em.textContent=EMOJIS[(i+1)%EMOJIS.length]; });
    const name=document.createElement('input'); name.type='text'; name.placeholder=t('class.groupPh'); name.value=label||''; name.style.width='100%';
    const num=document.createElement('input'); num.type='number'; num.min='0'; num.max='30'; num.value=(count!=null?count:0);
    const del=document.createElement('button'); del.type='button'; del.className='btn ghost'; del.textContent='✕'; del.setAttribute('aria-label',t('class.remove'));
    del.addEventListener('click',()=>{ if(rowsHost.children.length>2) r.remove(); });
    r.append(em,name,num,del);
    r.__get=()=>({label:name.value.trim()||t('class.groupPh'), emoji:em.textContent, count:Math.max(0,Math.min(30,parseInt(num.value||'0',10)))});
    return r;
  }
  function setRows(cats){ rowsHost.innerHTML=''; cats.forEach(c=>rowsHost.appendChild(rowFor(c.label,c.emoji,c.count))); }
  function fillTemplate(k){ const tpl=CLASS_TEMPLATES[k]; ti.value=t('tmpl.'+k+'.title');
    setRows(['a','b','c'].map((s,i)=>({label:t('tmpl.'+k+'.'+s), emoji:tpl.emojis[i], count:0}))); }
  setRows(['a','b','c'].map((s,i)=>({label:t('tmpl.fruit.'+s), emoji:CLASS_TEMPLATES.fruit.emojis[i], count:0})));

  const controls=document.createElement('div'); controls.className='btnrow';
  const add=document.createElement('button'); add.className='btn ghost'; add.type='button'; add.textContent='➕ '+t('class.add');
  add.addEventListener('click',()=>{ if(rowsHost.children.length<6) rowsHost.appendChild(rowFor('','⭐',0)); });
  const go=document.createElement('button'); go.className='btn'; go.type='button'; go.textContent='📊 '+t('class.make');
  controls.append(add,go); form.appendChild(controls);

  const out=document.createElement('div'); APP.appendChild(out);
  go.addEventListener('click',()=>{
    const cats=[...rowsHost.children].map(r=>r.__get());
    const title=ti.value||t('class.titleLabel');
    out.innerHTML='';
    const h=document.createElement('h2'); h.className='sec'; h.textContent=title; out.appendChild(h);
    const data=cats.map(c=>({ info:{label:c.label,emoji:c.emoji}, emoji:c.emoji, count:c.count, val:c.label }));
    buildGraphView(out, 'class', data, true);
    out.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

/* ---------------- Teacher Settings ---------------- */
function showSettings(){
  CURRENT=showSettings; clearApp(); ACTIVE=null;
  setDirection(APP, t('dir.settings'));
  const p=document.createElement('div'); p.className='panel';
  function segGroup(labelText, options, current, onPick){
    const f=document.createElement('div'); f.className='field';
    const l=document.createElement('label'); l.className='flabel'; l.textContent=labelText; f.appendChild(l);
    const row=document.createElement('div'); row.className='segrow';
    options.forEach(o=>{ const b=document.createElement('button'); b.className='seg'; b.type='button'; b.textContent=o.label; b.setAttribute('aria-pressed',String(o.val===current));
      b.addEventListener('click',()=>{ row.querySelectorAll('.seg').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onPick(o.val); });
      row.appendChild(b); });
    f.appendChild(row); return f;
  }
  p.appendChild(segGroup(t('set.objectSet'), [{val:'animals',label:'🐾 '+t('set.animals')},{val:'toys',label:'🧸 '+t('set.toys')}], SET.objectSet, v=>{ SET.objectSet=v; if(!availableAttrs().includes(SET.attr)) SET.attr='color'; saveSettings(); showSettings(); }));
  p.appendChild(segGroup(t('set.numGroups'), [{val:2,label:t('set.2groups')},{val:3,label:t('set.3groups')}], SET.numCats, v=>{ SET.numCats=v; saveSettings(); }));
  p.appendChild(segGroup(t('set.ruleDefault'), availableAttrs().map(a=>({val:a,label:attrIcon(a)+' '+attrLabel(a)})), SET.attr, v=>{ SET.attr=v; saveSettings(); }));
  p.appendChild(segGroup(t('set.maxPets'), [{val:4,label:t('set.upto',{n:4})},{val:6,label:t('set.upto',{n:6})},{val:10,label:t('set.upto',{n:10})}], SET.maxPer, v=>{ SET.maxPer=v; saveSettings(); }));
  const gf=document.createElement('div'); gf.className='field';
  const gl=document.createElement('label'); gl.className='switch';
  const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=SET.graphQ; cb.addEventListener('change',()=>{ SET.graphQ=cb.checked; saveSettings(); });
  gl.append(cb, document.createTextNode(t('set.graphQ'))); gf.appendChild(gl); p.appendChild(gf);
  APP.appendChild(p);
  const note=document.createElement('div'); note.className='panel';
  note.innerHTML='<b>'+t('set.privacyTitle')+'</b> '+t('set.privacyBody'); APP.appendChild(note);
  const row=document.createElement('div'); row.className='btnrow';
  const reset=document.createElement('button'); reset.className='btn ghost'; reset.type='button'; reset.textContent='↩️ '+t('set.reset');
  reset.addEventListener('click',()=>{ SET=Object.assign({},DEFAULTS); saveSettings(); showSettings(); });
  const done=document.createElement('button'); done.className='btn'; done.type='button'; done.textContent='✅ '+t('set.back');
  done.addEventListener('click', showMenu);
  row.append(done,reset); APP.appendChild(row);
}

(function boot(){
  initLang();
  const sel=document.getElementById('langSel');
  LANGS.forEach(l=>{ const o=document.createElement('option'); o.value=l.code; o.textContent=l.name; sel.appendChild(o); });
  sel.addEventListener('change', ()=> setLang(sel.value));
  document.getElementById('menuBtn').addEventListener('click', showMenu);
  document.getElementById('settingsBtn').addEventListener('click', showSettings);
  applyLang();
  showMenu();
})();
</script>
