<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create AI-Powered Publications and Dashboards | TCEA WebDeck</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A3476;
    --navy-dark:#071F4A;
    --navy-mid:#12428F;
    --gold:#FCB040;
    --gold-light:#FDD17A;
    --gold-pale:#FEF0D0;
    --pale-navy:#D0D8F0;
    --white:#ffffff;
    --off-white:#f7f8fc;
    --text:#1a1a2e;
    --text-muted:#5a6680;
    --border:#e2e7f5;
    --serif:'DM Serif Display',Georgia,serif;
    --sans:'DM Sans',-apple-system,sans-serif;
    --mono:'JetBrains Mono',Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--navy-dark);font-family:var(--sans);}

  /* ---------- Deck + slides ---------- */
  .deck{position:fixed;inset:0;}
  .slide{
    position:absolute;inset:0;opacity:0;visibility:hidden;
    transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(2.4rem,5vw,5rem) clamp(2.4rem,6vw,6rem) clamp(5rem,8vw,6.4rem);
    background:var(--off-white);
  }
  .slide.active{opacity:1;visibility:visible;}
  .slide.dark{background:var(--navy-dark);color:var(--white);}
  .slide.navy{background:var(--navy);color:var(--white);}
  /* full-bleed image slide */
  .slide.imgslide{padding:0;background:var(--navy-dark);}
  .slide.imgslide img{position:absolute;inset:0 0 3.4rem 0;width:100%;height:calc(100% - 3.4rem);object-fit:contain;}

  /* ---------- Type ---------- */
  .kicker{font-family:var(--sans);font-weight:700;font-size:clamp(.8rem,1.1vw,1rem);
    letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem;}
  h1{font-family:var(--serif);font-weight:400;line-height:1.04;color:var(--navy);
    font-size:clamp(2.4rem,5.4vw,4.4rem);letter-spacing:-.01em;}
  h2{font-family:var(--serif);font-weight:400;line-height:1.06;color:var(--navy);
    font-size:clamp(1.9rem,3.8vw,3.1rem);margin-bottom:1.2rem;}
  .dark h1,.navy h1,.dark h2,.navy h2{color:var(--white);}
  .lead{font-size:clamp(1.02rem,1.5vw,1.3rem);line-height:1.5;color:var(--text);max-width:60ch;}
  .dark .lead,.navy .lead{color:var(--pale-navy);}
  p{font-size:clamp(.98rem,1.35vw,1.18rem);line-height:1.5;color:var(--text);}
  .muted{color:var(--text-muted);}
  .gold{color:var(--gold);}
  strong{font-weight:700;}

  /* ---------- Title slide ---------- */
  .title-wrap{max-width:62rem;}
  .title-rule{width:5.5rem;height:5px;background:var(--gold);margin:1.6rem 0;border-radius:3px;}
  .title-meta{font-size:clamp(.85rem,1.15vw,1.02rem);color:var(--gold-light);margin-top:2.2rem;letter-spacing:.02em;}
  .blob{position:absolute;border-radius:50%;pointer-events:none;}

  /* ---------- Cards / grids ---------- */
  .grid{display:grid;gap:clamp(1rem,1.8vw,1.6rem);margin-top:1.6rem;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g5{grid-template-columns:repeat(5,1fr);}
  .card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;
    padding:clamp(1.1rem,1.8vw,1.7rem);box-shadow:0 8px 24px rgba(7,31,74,.07);}
  .card.on-dark{background:var(--navy-mid);border:none;color:var(--pale-navy);}
  .card .ico{width:3rem;height:3rem;border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);
    font-size:1.7rem;color:var(--navy);margin-bottom:.9rem;}
  .card h3{font-family:var(--serif);font-weight:400;color:var(--navy);
    font-size:clamp(1.2rem,1.9vw,1.65rem);margin-bottom:.2rem;}
  .card.on-dark h3{color:var(--white);}
  .card .phase{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;}
  .card p{font-size:clamp(.85rem,1.15vw,1rem);color:var(--text);}
  .card.on-dark p{color:var(--pale-navy);}
  .accent-l{border-left:5px solid var(--gold);}

  /* stat */
  .stat-card{background:var(--navy);border-radius:18px;padding:2rem;text-align:center;
    display:flex;flex-direction:column;justify-content:center;}
  .stat-num{font-family:var(--serif);font-size:clamp(4rem,9vw,7rem);color:var(--gold);line-height:.9;}
  .stat-lbl{color:var(--white);font-size:clamp(.95rem,1.3vw,1.15rem);margin-top:.8rem;}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:1.4rem;}
  .kpi{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:1.4rem;text-align:center;box-shadow:0 8px 24px rgba(7,31,74,.07);}
  .kpi.hot{background:var(--navy);border:none;}
  .kpi b{display:block;font-family:var(--serif);font-size:clamp(2.4rem,4.6vw,3.6rem);color:var(--navy);line-height:1;}
  .kpi.hot b{color:var(--gold);}
  .kpi span{display:block;font-weight:600;margin-top:.4rem;color:var(--text);}
  .kpi.hot span{color:var(--white);}
  .kpi em{display:block;font-style:italic;color:var(--text-muted);font-size:.85rem;margin-top:.2rem;}
  .kpi.hot em{color:var(--gold-light);}

  /* prompt block */
  .prompt{background:var(--navy-dark);border-radius:14px;padding:1.3rem 1.5rem;color:var(--pale-navy);
    box-shadow:0 8px 24px rgba(7,31,74,.12);}
  .prompt .ptop{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;}
  .prompt .badge{background:var(--gold);color:var(--navy);font-weight:700;font-size:.72rem;
    letter-spacing:.08em;padding:.28rem .7rem;border-radius:6px;text-transform:uppercase;}
  .prompt .plabel{font-style:italic;color:var(--gold-light);font-size:.88rem;}
  .prompt pre{font-family:var(--mono);font-size:clamp(.72rem,.95vw,.92rem);line-height:1.5;
    white-space:pre-wrap;color:var(--pale-navy);}

  /* browser frame */
  .frame{background:var(--white);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;
    box-shadow:0 12px 32px rgba(7,31,74,.1);}
  .frame .bar{background:var(--off-white);padding:.55rem .9rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);}
  .frame .bar i{width:.66rem;height:.66rem;border-radius:50%;display:block;}
  .frame .url{font-family:var(--mono);font-size:.74rem;color:var(--text-muted);margin-left:.6rem;}
  .frame .body{padding:1.3rem 1.5rem;}

  /* list */
  ul.clean{list-style:none;}
  ul.clean li{position:relative;padding-left:1.5rem;margin-bottom:.7rem;font-size:clamp(.95rem,1.3vw,1.12rem);line-height:1.45;}
  ul.clean li::before{content:"";position:absolute;left:0;top:.55em;width:.55rem;height:.55rem;border-radius:50%;background:var(--gold);}
  .dark ul.clean li,.navy ul.clean li,.card.on-dark ul.clean li{color:var(--pale-navy);}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1.4rem;}
  .step{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:1.2rem;box-shadow:0 8px 24px rgba(7,31,74,.07);}
  .step .n{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--gold);color:var(--navy);
    font-family:var(--serif);font-size:1.4rem;display:flex;align-items:center;justify-content:center;margin-bottom:.7rem;}
  .step h4{font-family:var(--serif);font-weight:400;color:var(--navy);font-size:1.18rem;margin-bottom:.3rem;}
  .step p{font-size:.9rem;color:var(--text);}

  /* table */
  table{width:100%;border-collapse:collapse;margin-top:1.3rem;font-size:clamp(.82rem,1.1vw,1rem);
    background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(7,31,74,.07);}
  thead th{background:var(--navy);color:var(--white);text-align:left;padding:.75rem 1rem;font-weight:600;}
  tbody td{padding:.7rem 1rem;border-bottom:1px solid var(--border);color:var(--text);}
  tbody tr:last-child td{border-bottom:none;}
  .callout{background:var(--gold-pale);border:1.5px solid var(--gold);border-radius:12px;
    padding:1rem 1.3rem;margin-top:1.2rem;font-size:clamp(.9rem,1.2vw,1.08rem);color:var(--text);}
  .callout b{color:var(--navy);}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.2rem,2.5vw,2.4rem);align-items:start;}
  .two-col.weighted{grid-template-columns:1.15fr .85fr;}
  .free-paid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:1.4rem;}
  .pill{display:inline-block;background:var(--gold-pale);border:1.5px solid var(--gold);color:var(--navy);
    font-weight:700;font-size:.82rem;padding:.4rem .9rem;border-radius:100px;}

  /* ---------- Floating bottom bar ---------- */
  .botbar{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;
    width:min(96vw,1180px);height:3rem;z-index:60;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(1rem,2.2vw,1.6rem);
    background:rgba(7,31,74,.94);border:1px solid rgba(252,176,64,.55);
    border-radius:100px;backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    font-family:var(--sans);}
  .botbar.on-light{background:rgba(7,31,74,.94);}
  .bb-left{display:flex;align-items:center;gap:.7rem;color:var(--pale-navy);font-size:.78rem;letter-spacing:.04em;}
  .bb-left .mark{font-family:var(--serif);color:var(--gold);font-size:1rem;}
  .bb-center{display:flex;align-items:center;gap:.4rem;}
  .bb-center .dot{width:.5rem;height:.5rem;border-radius:50%;background:rgba(208,216,240,.32);
    cursor:pointer;transition:all .25s;}
  .bb-center .dot.on{background:var(--gold);width:1.4rem;border-radius:100px;}
  .bb-right{display:flex;align-items:center;gap:.5rem;}
  .bb-right button{background:transparent;border:1px solid rgba(208,216,240,.28);color:var(--pale-navy);
    width:2rem;height:2rem;border-radius:8px;cursor:pointer;font-size:.95rem;display:flex;
    align-items:center;justify-content:center;transition:all .2s;}
  .bb-right button:hover{border-color:var(--gold);color:var(--gold);}
  .bb-right .count{color:var(--pale-navy);font-size:.8rem;font-variant-numeric:tabular-nums;min-width:3rem;text-align:center;}

  /* progress hairline */
  .progress{position:fixed;left:0;top:0;height:3px;background:var(--gold);z-index:50;width:0;transition:width .4s ease;}

  /* ---------- Speaker notes panel ---------- */
  .notes{position:fixed;inset:auto 0 4.5rem 0;z-index:45;
    background:rgba(7,31,74,.985);border-top:2px solid var(--gold);
    padding:clamp(1.2rem,3vw,2rem) clamp(1.6rem,5vw,3.5rem);
    transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.7,.2,1);
    max-height:42vh;overflow-y:auto;color:var(--white);
    pointer-events:none;}
  .notes.open{transform:translateY(0);pointer-events:auto;}
  .notes .nhead{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem;}
  .notes .nhead .badge{background:var(--gold);color:var(--navy);font-weight:700;font-size:.7rem;
    letter-spacing:.08em;padding:.25rem .6rem;border-radius:6px;text-transform:uppercase;}
  .notes .nhead .ntitle{color:var(--gold-light);font-size:.9rem;}
  .notes .nbody{font-size:clamp(.95rem,1.3vw,1.15rem);line-height:1.55;color:var(--pale-navy);max-width:90ch;}

  /* ---------- Help overlay ---------- */
  .help{position:fixed;inset:0;z-index:90;background:rgba(7,31,74,.92);
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
  .help.open{display:flex;}
  .help .panel{background:var(--white);border-radius:18px;padding:2.4rem 2.8rem;max-width:34rem;}
  .help h3{font-family:var(--serif);color:var(--navy);font-size:1.8rem;margin-bottom:1.2rem;}
  .help .row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border);}
  .help .row:last-child{border:none;}
  .help kbd{font-family:var(--mono);background:var(--off-white);border:1px solid var(--border);
    border-radius:6px;padding:.15rem .5rem;font-size:.85rem;color:var(--navy);}
  .help .close{margin-top:1.4rem;background:var(--gold);color:var(--navy);border:none;
    padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;font-family:var(--sans);}

  /* presenter mode (second window) */
  body.presenter .deck{position:static;}
  body.presenter .slide{position:static;display:none;}
  body.presenter .slide.active{display:flex;height:46vh;min-height:46vh;}
  body.presenter .botbar,body.presenter .progress{display:none;}
  .pv{display:none;}
  body.presenter .pv{display:block;position:fixed;inset:auto 0 0 0;height:54vh;
    background:var(--navy-dark);color:var(--white);padding:1.6rem 2.4rem;overflow-y:auto;border-top:3px solid var(--gold);}
  body.presenter .pv .pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  body.presenter .pv .pv-clock{font-family:var(--mono);font-size:1.4rem;color:var(--gold);}
  body.presenter .pv .pv-next{font-size:.8rem;color:var(--pale-navy);letter-spacing:.08em;text-transform:uppercase;}
  body.presenter .pv .pv-notes{font-size:1.15rem;line-height:1.55;color:var(--pale-navy);max-width:90ch;}
  body.presenter .pv .pv-controls{margin-top:1.2rem;display:flex;gap:.6rem;}
  body.presenter .pv .pv-controls button{background:var(--gold);color:var(--navy);border:none;
    padding:.5rem 1rem;border-radius:8px;font-weight:700;cursor:pointer;font-family:var(--sans);}
  body.presenter .pv .pv-controls button.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold);}

  /* ===================== RESPONSIVE ===================== */

  /* Tablet and below: ease the type scale and tighten padding */
  @media (max-width:1024px){
    .slide{padding:clamp(1.8rem,4vw,3.2rem) clamp(1.6rem,4vw,3.4rem) clamp(4.6rem,9vw,5.6rem);
      justify-content:flex-start;overflow-y:auto;}
    h1{font-size:clamp(2.1rem,6vw,3.4rem);}
    h2{font-size:clamp(1.7rem,4.6vw,2.5rem);}
    .grid{grid-template-columns:repeat(2,1fr);}
    .g5{grid-template-columns:repeat(5,1fr);} /* VIBES stays a strip on tablet */
    .steps{grid-template-columns:repeat(2,1fr);}
    .two-col.weighted{grid-template-columns:1fr 1fr;}
  }

  /* Small tablet / large phone: single column for most things */
  @media (max-width:768px){
    .slide{justify-content:flex-start;padding-top:clamp(1.4rem,5vw,2.4rem);}
    .g2,.g3,.g4,.g5,.steps,.two-col,.two-col.weighted,.free-paid,.kpi-row{grid-template-columns:1fr;}
    h1{font-size:clamp(1.9rem,8vw,2.8rem);}
    h2{font-size:clamp(1.5rem,6vw,2.1rem);}
    .lead,p{font-size:1rem;}
    /* the loop motif on the title can crowd text: shrink + push behind */
    .title-wrap{max-width:100%;}
    table{display:block;overflow-x:auto;white-space:nowrap;}
    .prompt pre{font-size:.78rem;}
    /* notes / presenter panels get taller on small screens */
    .notes{max-height:55vh;}
  }

  /* Phone: collapse bar label, shrink dots, stack everything */
  @media (max-width:560px){
    .slide{padding:1.4rem 1.1rem 5rem;}
    .kicker{font-size:.72rem;}
    h1{font-size:clamp(1.7rem,9vw,2.3rem);}
    h2{font-size:clamp(1.35rem,7vw,1.8rem);}
    .botbar{width:calc(100vw - 1.2rem);bottom:.6rem;padding:0 .7rem;height:2.7rem;}
    .bb-left{display:none;}            /* hide deck title text, keep controls + dots */
    .bb-center{gap:.28rem;flex:1;justify-content:center;overflow:hidden;}
    .bb-center .dot{width:.4rem;height:.4rem;}
    .bb-center .dot.on{width:1rem;}
    .bb-right{gap:.3rem;}
    .bb-right button{width:1.7rem;height:1.7rem;font-size:.8rem;}
    .bb-right .count{font-size:.72rem;min-width:2.6rem;}
    .stat-num{font-size:clamp(3.2rem,16vw,4.5rem);}
    .kpi b{font-size:clamp(2rem,12vw,2.8rem);}
    .prompt pre{font-size:.72rem;}
    .help .panel{padding:1.6rem 1.4rem;margin:1rem;}
    /* hide the large decorative blobs that crowd small screens */
    .blob{opacity:.25!important;}
    .title-motif{display:none;}
  }

  /* Very narrow phones: dots become a compact subset is overkill; let them wrap-free shrink */
  @media (max-width:380px){
    .bb-center .dot{width:.32rem;height:.32rem;}
    .bb-center .dot.on{width:.8rem;}
    .bb-right .count{display:none;}
  }

  /* Short / landscape phones: keep slide readable, bar tight */
  @media (max-height:480px) and (orientation:landscape){
    .slide{justify-content:flex-start;padding:1rem 2rem 4rem;}
    h1{font-size:clamp(1.6rem,5vw,2.4rem);}
    .botbar{bottom:.4rem;height:2.5rem;}
    .notes{max-height:60vh;}
  }

  /* Respect reduced motion */
  @media (prefers-reduced-motion:reduce){
    .slide,.notes,.progress,.bb-center .dot{transition:none;}
  }

  /* Touch devices: larger hit targets for bar controls */
  @media (hover:none){
    .bb-right button{min-width:2.2rem;min-height:2.2rem;}
    .bb-center .dot{min-height:1.1rem;padding:.3rem 0;background-clip:content-box;}
  }

</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="deck" id="deck"><!--SLIDES--></div>

<!-- minimalist bottom bar -->
<div class="botbar" id="botbar">
  <div class="bb-left"><span class="mark">◆</span> Create AI-Powered Publications and Dashboards</div>
  <div class="bb-center" id="dots"></div>
  <div class="bb-right">
    <button id="bNotes" title="Speaker notes (S)">▤</button>
    <button id="bPresent" title="Presenter view (P)">⧉</button>
    <button id="bFull" title="Fullscreen (F)">⛶</button>
    <button id="bHelp" title="Help (?)">?</button>
    <span class="count"><b id="cur">1</b> / <span id="total">1</span></span>
  </div>
</div>

<!-- speaker notes (audience window stays clean; this is a quick peek) -->
<div class="notes" id="notes">
  <div class="nhead"><span class="badge">Speaker Notes</span><span class="ntitle" id="ntitle"></span></div>
  <div class="nbody" id="nbody"></div>
</div>

<!-- presenter view (rendered only when body.presenter) -->
<div class="pv" id="pv">
  <div class="pv-head">
    <span class="pv-next" id="pvNext"></span>
    <span class="pv-clock" id="pvClock">00:00</span>
  </div>
  <div class="pv-notes" id="pvNotes"></div>
  <div class="pv-controls">
    <button id="pvPrev" class="ghost">‹ Prev</button>
    <button id="pvNext2">Next ›</button>
    <button id="pvReset" class="ghost">Reset timer</button>
  </div>
</div>

<!-- help -->
<div class="help" id="help">
  <div class="panel">
    <h3>Getting around</h3>
    <div class="row"><span>Next slide</span><span><kbd>→</kbd> <kbd>Space</kbd> <kbd>↓</kbd></span></div>
    <div class="row"><span>Previous slide</span><span><kbd>←</kbd> <kbd>↑</kbd></span></div>
    <div class="row"><span>Speaker notes</span><span><kbd>S</kbd></span></div>
    <div class="row"><span>Presenter view (dual screen)</span><span><kbd>P</kbd></span></div>
    <div class="row"><span>Fullscreen</span><span><kbd>F</kbd></span></div>
    <div class="row"><span>First / last slide</span><span><kbd>Home</kbd> <kbd>End</kbd></span></div>
    <div class="row"><span>This help</span><span><kbd>?</kbd></span></div>
    <button class="close" id="helpClose">Got it</button>
  </div>
</div>

<script>// ===== SLIDE DATA =====
// Each slide: { bg: ''|'dark'|'navy', html: '...', notes: '...', title: '...' }

const ART = {
  // title hero motif: stacked loop
  loop: `<svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
    <circle cx="100" cy="100" r="70" fill="none" stroke="#FCB040" stroke-width="6" stroke-dasharray="330 110" stroke-linecap="round" transform="rotate(-90 100 100)"/>
    <circle cx="100" cy="100" r="48" fill="none" stroke="#FDD17A" stroke-width="4" stroke-dasharray="200 100" stroke-linecap="round" transform="rotate(40 100 100)"/>
    <circle cx="100" cy="100" r="9" fill="#FCB040"/>
  </svg>`,
  // tiny bar chart for KPI slide
  bars: `<svg viewBox="0 0 320 180" width="100%" height="180" style="max-width:100%" role="img" aria-label="Sample KPI bar chart">
    <line x1="34" y1="150" x2="310" y2="150" stroke="#e2e7f5" stroke-width="1.5"/>

{

  html:`<div class="kicker">E &nbsp; Extend It</div>

      </div>
    </div>`,
  notes:`When you go to extend your work, you have choices about how the data shows up. I split these into two buckets. On the left are the easy patterns. Card flips, accordions, progress bars, comparison tables, and stat counters. These need no JavaScript, so they are self-contained and almost impossible to break. On the right are the medium patterns. Searchable lists, tabs, carousels, flashcard decks, and timelines. These need a little JavaScript, but the AI writes it for you. My advice is to start on the left. Most of the time an accordion or a stat counter does exactly what you need, and you can always reach for the right column later.`

{
  bg:'', title:'Easy Prompts',
  html:`<div class="kicker">E &nbsp; Extend It &nbsp;·&nbsp; Easy Prompts</div>
    <h2>Copy-ready prompts, CSS only</h2>
    <p class="muted" style="margin-bottom:1rem;">Easy patterns use no JavaScript, so nothing gets stripped. They work in every host, including WordPress Custom HTML blocks.</p>

      <div class="prompt"><div class="ptop"><span class="badge">Copy Prompt</span><span class="plabel">Card Flip</span></div><pre>Build a single self-contained HTML file with a row of
flip cards. Each card shows a headline number on the
front and a short explanation on the back, flipping on
hover and on click. CSS transforms only, no libraries.
TCEA navy #0A3476, gold #FCB040.

Data (label, number, explanation):

filled portion sized by CSS width with the percentage
shown inside the fill. Pure CSS, no JavaScript.

[PASTE LABEL AND PERCENTAGE PAIRS]</pre></div>

  notes:`Here are two of the easy prompts, copied straight off the site. On the left is the Card Flip. You give it a label, a number, and an explanation, and you get cards that flip to reveal the detail. On the right is Progress Bars, which is the fastest way to show proportion or completion. Look at how the prompts are written. They name the pattern, they specify a single self-contained file, they lock in the TCEA colors, and they end with a clear placeholder for your data. That structure is doing the VIBES work for you. You are giving the AI a precise vision and clear instructions, so the build comes back clean the first time. Notice both say CSS only, which is why they survive anywhere.`

  html:`<div class="kicker">E &nbsp; Extend It &nbsp;·&nbsp; Medium Prompts</div>

  notes:`These two step it up a little. The Searchable List filters items live as someone types, which is great for a course catalog or a glossary. The Timeline turns a date-and-event list into a clean vertical sequence, and you can even point it at an article and let it build the timeline for you. The important detail is the line in each prompt about hosting. Both of these use JavaScript. That means if your destination is WordPress, you do not paste them into a Custom HTML block, because the script gets stripped on save. You host the file on GitHub Pages and pull it in with an iframe. The prompt tells the AI that up front, so the output is built to survive where you plan to put it.`

{
  bg:'', title:'Hosting',
  html:`<div class="kicker">E &nbsp; Extend It &nbsp;·&nbsp; Hosting</div>
    <h2>Where your file survives</h2>
    <p class="muted">The same file behaves differently depending on where you embed it. Match your pattern to your host before you build.</p>
    <table>
      <thead><tr><th>Host</th><th>CSS only</th><th>Vanilla JS</th><th>Library charts</th><th>Best method</th></tr></thead>
      <tbody>
        <tr><td><strong>GitHub Pages</strong></td><td>Yes</td><td>Yes</td><td>Yes</td><td>Upload directly. Nothing is stripped.</td></tr>
        <tr><td><strong>Google Sites</strong></td><td>Yes</td><td>Yes</td><td>Usually</td><td>Insert, Embed, Code. Sandboxed iframe.</td></tr>
        <tr><td><strong>WordPress Custom HTML</strong></td><td>Yes</td><td>Stripped</td><td>Stripped</td><td>Fine for CSS only. JS needs another route.</td></tr>
        <tr><td><strong>WordPress iframe embed</strong></td><td>Yes</td><td>Yes</td><td>Yes</td><td>Host on GitHub Pages, embed with iframe.</td></tr>
        <tr><td><strong>LMS (Canvas, Schoology)</strong></td><td>Yes</td><td>Often</td><td>Varies</td><td>Use the iframe or external-tool option.</td></tr>
      </tbody>
    </table>
    <div class="callout"><b>The one rule:</b> if your pattern uses JavaScript and you are headed to WordPress, host it on GitHub Pages and pull it in with an iframe. The iframe keeps your script intact.</div>`,
  notes:`This table is the part people skip and then regret. The same HTML file behaves differently depending on where you put it. GitHub Pages serves whatever you give it, so everything works. Google Sites runs your file in a sandboxed iframe, which is usually fine, but avoid local storage there. The trap is the WordPress Custom HTML block. It keeps your CSS but strips your JavaScript on save for most users. So a CSS-only pattern is fine there, but anything with script will quietly break. The gold rule at the bottom is what saves you. If your pattern uses JavaScript and you are going to WordPress, host the file on GitHub Pages and bring it in with an iframe. The iframe is a separate document, so your script stays intact.`
},

</script>
<script>// ===== ENGINE =====
(function(){
  const deck = document.getElementById('deck');
  const $ = id => document.getElementById(id);

  // render slides
  deck.innerHTML = SLIDES.map((s,k)=>
    `<section class="slide ${s.bg||''}" data-i="${k}">${s.html}</section>`
  ).join('');
  const slideEls = Array.from(deck.querySelectorAll('.slide'));
  const total = slideEls.length;
  $('total').textContent = total;

  // dots
  $('dots').innerHTML = SLIDES.map((s,k)=>`<span class="dot" data-i="${k}" title="${s.title||('Slide '+(k+1))}"></span>`).join('');
  const dots = Array.from($('dots').querySelectorAll('.dot'));

  let i = 0, notesOpen = false, presenter = false;
  const isPresenterWindow = new URLSearchParams(location.search).get('presenter')==='1';

  // cross-window sync
  const chan = ('BroadcastChannel' in window) ? new BroadcastChannel('tcea-webdeck') : null;

  function render(){
    slideEls.forEach((el,k)=>el.classList.toggle('active', k===i));
    dots.forEach((d,k)=>d.classList.toggle('on', k===i));
    $('cur').textContent = i+1;
    $('progress').style.width = ((i+1)/total*100)+'%';
    // notes panel
    $('ntitle').textContent = SLIDES[i].title || '';
    $('nbody').textContent = SLIDES[i].notes || '';
    // presenter view
    if(presenter || document.body.classList.contains('presenter')){
      $('pvNotes').textContent = SLIDES[i].notes || '';
      const nxt = SLIDES[i+1];
      $('pvNext').textContent = nxt ? ('Next  ·  '+(nxt.title||('Slide '+(i+2)))) : 'End of deck';
    }
  }

  function go(n,broadcast=true){
    i = Math.max(0, Math.min(total-1, n));
    render();
    if(broadcast && chan) chan.postMessage({type:'go', i});
  }
  const next = ()=>go(i+1);
  const prev = ()=>go(i-1);

  // receive sync
  if(chan) chan.onmessage = e=>{
    if(e.data.type==='go') go(e.data.i, false);
  };

  // ----- notes -----
  function toggleNotes(){ notesOpen=!notesOpen; $('notes').classList.toggle('open',notesOpen); }

  // ----- presenter (dual screen) -----
  function togglePresenter(){
    // open a second window that shows audience slides; this window becomes presenter console
    const w = window.open(location.pathname+'?presenter=0','tcea_audience','width=1280,height=800');
    if(!w){ alert('Allow pop-ups to open the audience window, then press P again.'); return; }
    document.body.classList.add('presenter');
    presenter = true;
    render();
  }

  // presenter clock
  let t0 = Date.now();
  function fmt(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  setInterval(()=>{ if(presenter||isPresenterWindow){ $('pvClock').textContent = fmt(Date.now()-t0); } },1000);
  $('pvReset').onclick = ()=>{ t0=Date.now(); };
  $('pvPrev').onclick = prev;
  $('pvNext2').onclick = next;

  // if this window is the audience window opened by presenter, keep chrome minimal
  if(isPresenterWindow){
    document.getElementById('botbar').style.opacity='.6';
  }

  // ----- fullscreen -----
  function toggleFull(){
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); }
    else { document.exitFullscreen?.(); }
  }

  // ----- help -----
  function toggleHelp(){ $('help').classList.toggle('open'); }

  // buttons
  $('bNotes').onclick = toggleNotes;
  $('bPresent').onclick = togglePresenter;
  $('bFull').onclick = toggleFull;
  $('bHelp').onclick = toggleHelp;
  $('helpClose').onclick = toggleHelp;
  dots.forEach(d=>d.onclick=()=>go(+d.dataset.i));

  // keyboard
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'||e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ go(0); }
    else if(e.key==='End'){ go(total-1); }
    else if(e.key.toLowerCase()==='s'){ toggleNotes(); }
    else if(e.key.toLowerCase()==='p'){ togglePresenter(); }
    else if(e.key.toLowerCase()==='f'){ toggleFull(); }
    else if(e.key==='?'){ toggleHelp(); }
    else if(e.key==='Escape'){ $('help').classList.remove('open'); if(notesOpen) toggleNotes(); }
  });

  // touch swipe
  let tx=0;
  deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
  deck.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50){ dx<0?next():prev(); }},{passive:true});

  // click left / right edge to navigate
  deck.addEventListener('click', e=>{
    // ignore clicks on anything interactive or on chrome layers
    if(e.target.closest('a, button, input, textarea, select, label, .botbar, .notes, .help, .pv, [onclick], [role="button"]')) return;
    // ignore if a panel/overlay is open or in presenter mode
    if(notesOpen || $('help').classList.contains('open') || presenter) return;
    // ignore text selections (user dragged)
    if(window.getSelection && String(window.getSelection())) return;
    const x = e.clientX;
    const w = window.innerWidth;
    if(x < w*0.35) prev();
    else if(x > w*0.65) next();
    // middle 30% is a neutral zone: does nothing, so clicking slide content is safe
  });

  // cursor hint: show nav cursor near the left/right edges
  deck.addEventListener('mousemove', e=>{
    if(notesOpen || $('help').classList.contains('open') || presenter){ deck.style.cursor=''; return; }
    if(e.target.closest('a, button, input, textarea, select, label, .botbar, .notes, .help, .pv')){ deck.style.cursor=''; return; }
    const x=e.clientX, w=window.innerWidth;
    deck.style.cursor = (x < w*0.35) ? 'w-resize' : (x > w*0.65) ? 'e-resize' : 'default';
  });

  // deep link via hash (initial + live changes)
  function fromHash(){
    const h = parseInt(location.hash.replace('#',''),10);
    if(!isNaN(h)) go(h-1, false);
  }
  window.addEventListener('hashchange', fromHash);
  const h0 = parseInt(location.hash.replace('#',''),10);
  if(!isNaN(h0)) i = Math.max(0,Math.min(total-1,h0-1));

  render();
})();
</script>
