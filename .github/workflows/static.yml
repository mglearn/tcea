# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so build-feed.js can read each file's last-commit date.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build RSS feed (feed.xml + updates.json)
        run: node build-feed.js
      - name: Build ITD dashboard stats (itd/stats.json)
        run: node build-itd-stats.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Strip paths listed in .pagesignore from this throwaway checkout so they
      # never reach the published site. The files stay in git, so cloning and
      # pulling still bring them down. See .pagesignore for the caveat: this
      # hides them from the website, not from a public repo on github.com.
      - name: Withhold private paths from the site artifact
        run: |
          set -euo pipefail
          if [ ! -f .pagesignore ]; then
            echo "No .pagesignore, publishing everything."
            exit 0
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            path="${line%%#*}"
            path="$(printf '%s' "$path" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$path" ] && continue
            case "$path" in
              /*|*..*) echo "Refusing unsafe .pagesignore entry: $path" >&2; exit 1 ;;
            esac
            if [ -e "$path" ]; then
              rm -rf -- "$path"
              echo "withheld: $path"
            else
              echo "not present, nothing to withhold: $path"
            fi
          done < .pagesignore
          # The list itself is guidance for maintainers, not site content.
          rm -f .pagesignore
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages hard-caps timeout at 600000 (10 min); the real fix for the
          # "Timeout reached, aborting!" failures was cutting the deployed file count
          # (~1176 -> ~874) by collapsing 304 redirect stubs into one 404.html handler.
          error_count: 15
