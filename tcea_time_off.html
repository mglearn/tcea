<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TCEA Leave WebDeck</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,850&family=IBM+Plex+Mono:wght@500&display=swap');
:root{--navy:#0e1b2a;--ink:#162033;--paper:#fbfaf6;--muted:#687082;--accent:#f28c38;--teal:#2f8f8a;--line:#d9d1c5;--white:#fff;--bar:rgba(255,255,255,.76);--darkbar:rgba(14,27,42,.78)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--navy);overflow:hidden}.deck{height:100vh;width:100vw;position:relative}.slide{position:absolute;inset:0;padding:clamp(3rem,6vw,6rem) clamp(1.4rem,7vw,7rem) 7.5rem;display:none;overflow-y:auto}.slide.active{display:block}.slide.light{background:linear-gradient(135deg,var(--paper),#fff)}.slide.dark,.slide.navy{background:radial-gradient(circle at 82% 16%,rgba(242,140,56,.25),transparent 32%),linear-gradient(135deg,#07111e,var(--navy));color:#fff}.slide.dark *,.darkcard *{color:inherit}.progress{position:fixed;top:0;left:0;height:5px;background:var(--accent);width:0;z-index:30;transition:width .25s}.hero{max-width:1100px}.eyebrow{font:700 clamp(.74rem,1.2vw,.95rem)/1 IBM Plex Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 1rem}.dark .eyebrow{color:#ffb36b}h1,h2{font-family:Fraunces,Georgia,serif;margin:.1em 0 .35em;line-height:.95}h1{font-size:clamp(3.1rem,8vw,7.8rem);max-width:1050px}h2{font-size:clamp(2.1rem,5vw,4.8rem);max-width:1050px}.lead{font-size:clamp(1.2rem,2vw,1.7rem);line-height:1.45;max-width:850px;color:inherit}.lead.small{font-size:clamp(1.05rem,1.5vw,1.35rem)}.hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-top:3rem;max-width:900px}.hero-grid span,.note-strip{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:24px;padding:1rem;text-align:center;font-weight:800}.slide.light .note-strip{border-color:var(--line);background:#fff;text-align:left;color:var(--ink);font-size:clamp(1rem,1.5vw,1.25rem)}.cards{display:grid;gap:1rem;margin-top:2rem}.cards.four{grid-template-columns:repeat(4,1fr)}.cards.three{grid-template-columns:repeat(3,1fr)}article,.callout,.stat,.timeline>div,.process>div,.checklist{background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(1rem,2vw,1.55rem);box-shadow:0 16px 45px rgba(20,25,30,.08)}article b,.process span,.timeline b{display:block;font-size:clamp(1.2rem,2vw,1.6rem);margin-bottom:.5rem}article p,.timeline p,.process p,li{font-size:clamp(1rem,1.4vw,1.2rem);line-height:1.45;color:var(--muted)}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(1.5rem,4vw,4rem);align-items:center}.callout{font-size:1.1rem}.darkcard{background:var(--navy);border-color:#314458;color:#fff}.darkcard li{color:#d9e1e8}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2rem}.timeline span{font:700 .8rem IBM Plex Mono;color:var(--teal);text-transform:uppercase}.stat{background:var(--teal);color:#fff;text-align:center}.stat span{font-family:Fraunces;font-size:clamp(5rem,11vw,9rem);display:block;line-height:.9}.stat p{font-size:clamp(1.05rem,1.6vw,1.35rem);line-height:1.35}.holiday-list{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.holiday-list span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.85rem 1rem;font-weight:700}.process{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2rem}.process b{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;margin-bottom:1rem}.biglist li{margin-bottom:.65rem}.checklist{max-width:1050px;margin-top:1.5rem}.checklist p{font-size:clamp(1.05rem,2vw,1.55rem);border-bottom:1px solid var(--line);padding:.65rem 0;margin:0}.rule{height:3px;width:160px;background:var(--accent);margin:2rem 0}.smallprint{font-size:clamp(.85rem,1.2vw,1rem);opacity:.78;max-width:850px}.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:.7rem;max-width:min(94vw,1120px);padding:.55rem .75rem;border:1px solid rgba(242,140,56,.45);background:var(--bar);backdrop-filter:blur(16px);border-radius:999px;box-shadow:0 18px 60px rgba(0,0,0,.22)}.nav button{border:0;border-radius:999px;padding:.62rem .85rem;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.deck-title{font-weight:800;white-space:nowrap}.dots{display:flex;gap:.22rem;align-items:center}.dot{width:16px;height:16px;border-radius:999px;background:#aab2bd;border:0;padding:0;cursor:pointer}.dot.active{width:34px;background:var(--accent)}.counter{font:700 .9rem IBM Plex Mono;color:var(--ink)}.panel{position:fixed;left:50%;bottom:95px;transform:translate(-50%,120%);width:min(900px,92vw);max-height:55vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:28px;padding:1.25rem;z-index:45;box-shadow:0 18px 70px rgba(0,0,0,.25);pointer-events:none;transition:transform .25s}.panel.open{transform:translate(-50%,0);pointer-events:auto}.help{position:fixed;inset:0;background:rgba(5,10,18,.68);display:none;place-items:center;z-index:50}.help.open{display:grid}.help-card{background:#fff;border-radius:28px;padding:2rem;max-width:720px}.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}kbd{font-family:IBM Plex Mono;background:#eee;border-radius:6px;padding:.16rem .4rem}.presenter{padding:2rem;background:var(--paper);color:var(--ink);height:100vh;overflow:auto}.presenter-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.mini{border:1px solid var(--line);border-radius:18px;padding:1rem;background:#fff;min-height:260px;overflow:auto}.timer{font:700 2rem IBM Plex Mono;color:var(--teal)}@media(max-width:1024px){.cards.four,.timeline,.process{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:768px){.cards.three{grid-template-columns:1fr}.holiday-list{grid-template-columns:1fr}.deck-title{display:none}.slide{padding-top:3rem}}@media(max-width:560px){.cards.four,.timeline,.process{grid-template-columns:1fr}.nav{gap:.35rem}.nav button{padding:.55rem}.dot{width:12px;height:12px}.dot.active{width:24px}.counter{display:none}h1{font-size:clamp(2.6rem,15vw,4.2rem)}}@media(max-height:520px) and (orientation:landscape){.slide{padding-top:1.5rem}.nav{bottom:8px}.panel{bottom:72px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.hero-legal{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,280px);gap:2rem;align-items:center}.illo{display:grid;place-items:center;max-width:260px;margin:auto}.illo svg{width:min(100%,240px);height:auto;filter:drop-shadow(0 16px 24px rgba(14,27,42,.16))}.dark .illo svg{filter:drop-shadow(0 20px 30px rgba(0,0,0,.28))}.cards article .illo{max-width:105px;margin:0 0 .7rem}.split-illus{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:clamp(1rem,3vw,3rem);align-items:center}.lawbox{display:grid;grid-template-columns:92px 1fr;gap:1rem;align-items:start;border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:28px;padding:1.15rem;box-shadow:0 18px 36px rgba(14,27,42,.08)}.lawbox .illo{max-width:86px}.lawbox .illo svg{width:86px}.lawbox b{font-size:1.1rem}.lawbox p{margin:.35rem 0 .4rem;line-height:1.45;color:var(--ink)}.lawbox small{display:block;color:var(--muted);font-size:.78rem;line-height:1.35}.compact{grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem}.source-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:1rem;margin-top:2rem;max-width:1050px}.source-grid div{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:26px;padding:1.2rem}.source-grid p{line-height:1.45}.dark .source-grid *{color:#fff}.stat + .lawbox{margin-top:1rem}@media(max-width:900px){.hero-legal,.split-illus,.source-grid{grid-template-columns:1fr}.split-illus>.lawbox{order:2}.hero-legal>.illo{max-width:170px}.compact{grid-template-columns:1fr}.lawbox{grid-template-columns:72px 1fr}.lawbox .illo svg{width:68px}}@media(max-width:560px){.cards article .illo{max-width:80px}.lawbox{grid-template-columns:1fr}.lawbox .illo{display:none}.holiday-list{grid-template-columns:1fr!important}}
</style></head><body><div class='deck' id='deck'><div class='progress' id='progress'></div><div id='slides'></div><aside class='panel' id='notes'></aside><div class='help' id='help'><div class='help-card'><h2>Shortcuts</h2><div class='help-grid'><p><kbd>→</kbd> <kbd>Space</kbd> Next</p><p><kbd>←</kbd> Previous</p><p><kbd>Home</kbd> First</p><p><kbd>End</kbd> Last</p><p><kbd>N</kbd> Notes</p><p><kbd>P</kbd> Presenter</p><p><kbd>F</kbd> Fullscreen</p><p><kbd>H</kbd> Help</p></div></div></div><nav class='nav'><span class='deck-title'>TCEA Leave + Time Off</span><button id='prev'>Back</button><div class='dots' id='dots'></div><span class='counter' id='counter'></span><button id='next'>Next</button><button id='notesBtn'>Notes</button><button id='presentBtn'>Present</button><button id='fs'>Full</button><button id='helpBtn'>?</button></nav></div><script>
const SLIDES = [{"bg": "dark", "title": "TCEA Leave + Texas Law Lens", "html": "\n<section class='hero hero-legal'><div><p class='eyebrow'>TCEA Employee Handbook 2026-2027 + Texas employment context</p><h1>Leave, time off, and what Texas law adds</h1><p class='lead'>A practical WebDeck that pairs each TCEA handbook item with the Texas or federal rule that may matter.</p><div class='hero-grid'><span>Handbook rule</span><span>Legal floor</span><span>Pay impact</span><span>Proof needed</span></div></div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><circle cx='120' cy='120' r='76' fill='#f28c38'/><path d='M78 126l28 28l58-72' stroke='white' stroke-width='14' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='176' cy='64' r='18' fill='#2f8f8a'/></svg></div></section>\n", "notes": "This revised deck looks at TCEA leave and time off through two lenses. First, it summarizes what the TCEA handbook says employees should do. Second, it adds the Texas or federal legal context where there is one. That distinction matters because many paid benefits are not required by Texas law, but they can become enforceable when the employer puts them in a written policy. I am not treating this as legal advice. I am using it as a practical guide for understanding which rules come from the handbook, which rules come from law, and which items depend mainly on TCEA’s written policy."}, {"bg": "light", "title": "How to Read the Deck", "html": "\n<div class='two'><div><p class='eyebrow'>Reading rule</p><h2>Separate the benefit from the legal floor.</h2><p class='lead small'>Texas often lets private employers decide whether to offer paid leave benefits. Once those benefits are promised in writing, the written policy becomes important under the Texas Payday Law.</p></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='72' y='50' width='86' height='36' rx='10' fill='#0e1b2a' transform='rotate(-28 115 68)'/><rect x='122' y='82' width='34' height='112' rx='12' fill='#f28c38' transform='rotate(-28 139 138)'/><rect x='42' y='160' width='150' height='20' rx='10' fill='#0e1b2a' opacity='.9'/><circle cx='188' cy='62' r='20' fill='#f28c38' opacity='.25'/></svg></div></div><div><b>Legal lens</b><p>Look for whether the law requires the time off, protects the absence, requires pay, or simply enforces the written policy.</p><small>Sources: TWC Texas Payday Law; TWC Fringe Benefits</small></div></aside></div>\n", "notes": "This slide gives the rule of thumb for reading everything that follows. A handbook benefit and a legal requirement are not always the same thing. Some TCEA benefits are more generous than what Texas law requires. For example, Texas generally does not require private employers to provide vacation pay, holiday pay, or paid sick leave. But if an employer creates a written policy promising those benefits, the Texas Payday Law can enforce that policy according to its terms. So for each item, I am asking four questions: does the law require the leave, does it protect the absence, does it require pay, and what does the written policy promise?"}, {"bg": "light", "title": "Texas Baseline", "html": "\n<div class='slide-head'><p class='eyebrow'>Baseline</p><h2>Most paid time off is policy-driven in Texas.</h2></div><div class='cards three'><article><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><path d='M34 110Q120 30 206 110Z' fill='#2f8f8a'/><path d='M34 110q28-26 57 0q29-26 58 0q28-26 57 0' fill='#f28c38' opacity='.8'/><path d='M120 110v64q0 24 28 24q20 0 22-18' fill='none' stroke='#2f8f8a' stroke-width='10' stroke-linecap='round'/><circle cx='66' cy='68' r='11' fill='#f28c38' opacity='.55'/><circle cx='183' cy='49' r='8' fill='#f28c38' opacity='.45'/></svg></div><b>No general paid leave mandate</b><p>Texas does not generally require private employers to provide vacation, sick/personal, holiday, bereavement, or personal leave pay.</p></article><article><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='58' y='42' width='124' height='154' rx='20' fill='white' stroke='#2f8f8a' stroke-width='8'/><rect x='88' y='28' width='64' height='36' rx='14' fill='#f28c38'/><path d='M84 100h72M84 132h72M84 164h46' stroke='#2f8f8a' stroke-width='9' stroke-linecap='round'/><path d='M73 100l10 10l18-22' stroke='#f28c38' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg></div><b>Written policies matter</b><p>Vacation, sick leave, holiday pay, parental leave, severance, PTO, and paid days off can be enforceable if promised in writing.</p></article><article><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='72' y='50' width='86' height='36' rx='10' fill='#0e1b2a' transform='rotate(-28 115 68)'/><rect x='122' y='82' width='34' height='112' rx='12' fill='#f28c38' transform='rotate(-28 139 138)'/><rect x='42' y='160' width='150' height='20' rx='10' fill='#0e1b2a' opacity='.9'/><circle cx='188' cy='62' r='20' fill='#f28c38' opacity='.25'/></svg></div><b>Payout depends on wording</b><p>Accrued leave payouts are required only when a written policy or agreement specifically promises the payout.</p></article></div>\n", "notes": "The broad Texas baseline is simple but important. For a private employer, Texas law generally does not require paid vacation, sick or personal days, holiday pay, bereavement pay, or personal leave pay. TCEA can offer those benefits because it chooses to do so in its handbook. Once written down, however, the policy language matters. TWC explains that the Texas Payday Law can enforce promised fringe benefits, including vacation pay, sick leave pay, parental leave pay, holiday pay, severance pay, PTO, or paid days off. That is why the exact wording around eligibility, accrual, carryover, notice, and payout matters."}, {"bg": "light", "title": "Attendance + Notice", "html": "\n<div class='split-illus'><div><p class='eyebrow'>Absences and tardiness</p><h2>Handbook rule: notify personally and on time.</h2><ul class='biglist'><li>Known absence or lateness: notify the supervisor personally no later than one hour before scheduled start time.</li><li>Illness or accident while working: notify the supervisor immediately.</li><li>Medical documentation may be required for illness or return to work.</li><li>No proper notice may be treated as job abandonment.</li></ul></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='36' y='46' width='168' height='128' rx='20' fill='white' stroke='#2f8f8a' stroke-width='8'/><rect x='36' y='46' width='168' height='38' rx='18' fill='#2f8f8a'/><circle cx='76' cy='112' r='13' fill='#f28c38'/><circle cx='120' cy='112' r='13' fill='#f28c38'/><circle cx='164' cy='112' r='13' fill='#f28c38'/><path d='M76 30v34M164 30v34' stroke='#f28c38' stroke-width='12' stroke-linecap='round'/></svg></div></div><div><b>Texas law context</b><p>Attendance rules are generally employer policy, but protected absences such as military leave, jury duty, subpoenaed witness leave, voting leave, workers’ comp issues, disability accommodations, and FMLA may not be treated like ordinary unexcused absences.</p><small>Sources: TWC Attendance and Leave Policies; DOL FMLA</small></div></aside></div>\n", "notes": "The handbook’s attendance rule is operational. If I know I will be absent or late, I need to personally notify my supervisor no later than one hour before my scheduled start time. For illness or an accident while performing duties, I notify immediately. TCEA may require medical documentation for an illness-related absence or return to work. The legal context is that ordinary attendance rules are usually a policy issue, but not every absence can be treated as ordinary. Military leave, jury duty, subpoenaed witness leave, voting leave, workers’ compensation issues, disability accommodations, and FMLA can carry legal protections that override a simple no-fault attendance approach."}, {"bg": "light", "title": "Vacation", "html": "\n<div class='two'><div><p class='eyebrow'>Vacation</p><h2>TCEA gives vacation; Texas law mainly enforces the written promise.</h2><div class='timeline'><div><span>Eligibility</span><b>Regular full-time</b><p>New employees may not take vacation before day 90.</p></div><div><span>Amount</span><b>10 days / 80 hours</b><p>After five years, one extra day per year, up to 22 days.</p></div><div><span>Plan year</span><b>April 1–March 31</b><p>No carryover from year to year.</p></div><div><span>Payout</span><b>Conditional</b><p>Accrued unused vacation is paid at separation only if two weeks’ written notice is given and the employee is not terminated for misconduct.</p></div></div></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><circle cx='164' cy='62' r='24' fill='#2f8f8a'/><path d='M42 160c42-32 98-33 156 0' fill='none' stroke='#f28c38' stroke-width='14' stroke-linecap='round'/><path d='M84 139l52-70l64 70' fill='none' stroke='#2f8f8a' stroke-width='11' stroke-linecap='round'/><path d='M136 69v98' stroke='#f28c38' stroke-width='8' stroke-linecap='round'/><path d='M90 78c25-22 67-24 99 4' fill='none' stroke='#f28c38' stroke-width='10' stroke-linecap='round'/></svg></div></div><div><b>Texas law context</b><p>Texas does not require employers to provide vacation or unused-vacation payout. But TWC says written vacation policies are enforceable according to their terms. TCEA’s payout language is therefore important.</p><small>Sources: TWC Vacation and Sick Leave; TWC Accrued Leave Payouts</small></div></aside></div>\n", "notes": "Vacation is one of the clearest examples of the handbook being more specific than the legal floor. TCEA gives vacation to regular full-time employees. New employees may not take it before day ninety. The base amount is ten days or eighty hours, and after five years employees earn one additional day per year up to twenty-two days. The plan year runs April 1 through March 31, and vacation does not carry over. Texas does not require vacation or a payout of unused vacation. But because the handbook promises a conditional payout, the Texas Payday Law analysis turns on the written terms: two weeks’ written notice and no termination for misconduct."}, {"bg": "light", "title": "Sick / Personal Days", "html": "\n<div class='two'><div><p class='eyebrow'>Sick / personal days</p><h2>Paid sick/personal days are a TCEA policy benefit.</h2><div class='cards compact'><article><b>10 days per year</b><p>For full-time regular employees.</p></article><article><b>Carryover allowed</b><p>Unused days may carry over for up to three years.</p></article><article><b>No payout</b><p>No payment at year-end or termination.</p></article><article><b>Approval</b><p>Personal days require advance Executive Director approval.</p></article></div></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='96' y='36' width='48' height='116' rx='24' fill='white' stroke='#2f8f8a' stroke-width='8'/><circle cx='120' cy='164' r='36' fill='#e85d75'/><path d='M120 78v80' stroke='#e85d75' stroke-width='14' stroke-linecap='round'/><path d='M162 60h34M162 92h24M162 124h34' stroke='#2f8f8a' stroke-width='8' stroke-linecap='round'/></svg></div></div><div><b>Texas law context</b><p>Texas has no statewide private-employer paid sick leave requirement. If sick/personal days are promised in a written policy, TWC treats the written policy as controlling, including limits and no-payout language.</p><small>Sources: TWC Vacation, Sick, and Parental Leave Policies; TWC Fringe Benefits</small></div></aside></div>\n", "notes": "The sick and personal day policy is also mainly a TCEA benefit, not a statewide Texas mandate. Full-time regular employees receive ten paid sick or personal days each year. Unused days can carry over from year to year, but only for a maximum of three years. The handbook also states that no payments are made for accrued unused sick or personal days at year-end or at termination. That no-payout language matters because TWC generally looks to the written policy to decide whether a fringe benefit must be paid. Personal days still need advance approval from the Executive Director, and illness-related absences may still trigger documentation requirements."}, {"bg": "light", "title": "Holidays", "html": "\n<div class='split-illus'><div><p class='eyebrow'>Holidays</p><h2>TCEA observes 18 paid holidays.</h2><p class='lead small'>Regular full-time employees are eligible. Nonexempt employees must work the scheduled workday before and after the holiday unless the Executive Director approves a written exception. Holiday pay does not count as hours worked for overtime.</p><div class='holiday-list'><span>New Year’s Day</span><span>Day after Convention</span><span>Spring Break week</span><span>Good Friday</span><span>Memorial Day</span><span>Independence Day</span><span>Labor Day</span><span>Thanksgiving + Friday</span><span>Christmas Week</span></div></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><circle cx='120' cy='120' r='76' fill='#f28c38'/><path d='M78 126l28 28l58-72' stroke='white' stroke-width='14' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='176' cy='64' r='18' fill='#2f8f8a'/></svg></div></div><div><b>Texas law context</b><p>Texas does not require private employers to observe holidays or pay employees for holiday time off. If holiday pay is offered in writing, the policy governs. Paid leave normally is not “hours worked” for overtime calculation.</p><small>Sources: TWC Holiday Policies; TWC Texas Payday Law</small></div></aside></div>\n", "notes": "TCEA’s holiday policy is more generous than the Texas legal floor. The handbook says regular full-time employees are eligible for paid holidays and lists eighteen holidays each year. For nonexempt employees, holiday pay depends on working the regularly scheduled workday before and after the holiday unless the Executive Director approves a written exception. The handbook also states that paid holidays do not count as a day worked for overtime. Texas does not generally require private employers to observe holidays or pay holiday leave. But if holiday pay is promised in writing, the written policy is what TWC looks to enforce."}, {"bg": "light", "title": "Personal Leave of Absence", "html": "\n<div class='two'><div><p class='eyebrow'>Personal leave of absence</p><h2>Extended leave is discretionary unless another law applies.</h2><div class='process'><div><b>1</b><span>Ask in writing</span><p>30 days before leave, or as soon as practicable.</p></div><div><b>2</b><span>Use accrued days</span><p>Personal and vacation days must be used before unpaid leave.</p></div><div><b>3</b><span>Benefits cap</span><p>Benefits may continue up to 12 weeks if the employee pays their share.</p></div><div><b>4</b><span>Return release</span><p>Illness or injury leave requires a job-related return-to-work release.</p></div></div></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><circle cx='120' cy='120' r='78' fill='white' stroke='#f28c38' stroke-width='8'/><path d='M138 72l-16 64l-48 32l16-64z' fill='#2f8f8a'/><path d='M102 168l16-64l48-32l-16 64z' fill='#f28c38' opacity='.85'/><circle cx='120' cy='120' r='8' fill='white'/><path d='M120 31v22M120 187v22M31 120h22M187 120h22' stroke='#f28c38' stroke-width='8' stroke-linecap='round'/></svg></div></div><div><b>Texas law context</b><p>Texas does not create a general personal-leave entitlement for private employees. Federal FMLA may apply only if TCEA is a covered employer and the employee meets eligibility rules: 12 months, 1,250 hours, and 50 employees within 75 miles.</p><small>Sources: DOL FMLA; TWC Attendance and Leave Policies</small></div></aside></div>\n", "notes": "Personal leave in the handbook is discretionary. It may be granted when TCEA determines that an extended period away is in the best interest of both the employee and the Association. Requests should be submitted in writing to the Executive Director at least thirty days before the leave begins, or as soon as practicable. Employees must use accrued personal and vacation days before unpaid leave. Benefits may continue for up to twelve weeks if the employee keeps paying their portion, but paid time does not accrue while on leave. The legal caveat is FMLA: it may apply only if the employer and employee meet the federal coverage and eligibility rules."}, {"bg": "light", "title": "Military Leave", "html": "\n<div class='split-illus'><div><p class='eyebrow'>Military leave</p><h2>Military leave has federal job-protection rules.</h2><ul class='biglist'><li>Applies to full-time regular and part-time regular employees.</li><li>Leave is unpaid for military service, reserve duty, or National Guard training.</li><li>Submit military orders to the Executive Director as soon as possible.</li><li>Accrued vacation or PTO may be used.</li><li>Reinstatement follows applicable federal and state law.</li></ul></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><path d='M70 192V38' stroke='#f28c38' stroke-width='10' stroke-linecap='round'/><path d='M78 46c38-24 62 24 100 0v82c-38 24-62-24-100 0z' fill='#2f8f8a'/><path d='M102 84l10 20l22 3l-16 15l4 22l-20-10l-20 10l4-22l-16-15l22-3z' fill='white' opacity='.9'/></svg></div></div><div><b>Texas law context</b><p>USERRA protects civilian employment and reemployment rights for uniformed-service leave. TWC notes that Texas paid military leave for up to 15 days applies to government employees, not private employers.</p><small>Sources: DOL USERRA; TWC Legal Issues for Military Leave</small></div></aside></div>\n", "notes": "Military leave is different because the legal context is stronger. TCEA grants unpaid military leave to full-time regular and part-time regular employees who are called to active duty, reserve duty, National Guard training, or who volunteer for the same. Employees should submit military orders to the Executive Director as soon as possible. The employee may use accrued unused vacation or PTO. USERRA provides federal protection for reemployment rights after uniformed service. TWC also notes that Texas law gives paid military leave to government employees for up to fifteen days, but that Texas paid-military-leave rule does not apply to private employers."}, {"bg": "light", "title": "Bereavement Leave", "html": "\n<div class='two'><div><p class='eyebrow'>Bereavement</p><h2>Bereavement pay is a TCEA policy benefit.</h2><div class='cards compact'><article><b>Up to 5 consecutive paid days</b><p>For specified immediate-family relationships.</p></article><article><b>2 paid days</b><p>For specified extended-family relationships.</p></article><article><b>Request path</b><p>Requests go to the Executive Director.</p></article><article><b>Day notified</b><p>If the employee leaves early when notified, that day does not count as bereavement leave.</p></article></div></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><path d='M120 184s-74-42-74-94c0-26 18-45 42-45c14 0 26 7 32 18c6-11 18-18 32-18c24 0 42 19 42 45c0 52-74 94-74 94z' fill='#e85d75'/><path d='M78 112h28l13-25l22 54l13-29h31' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='184' cy='56' r='16' fill='#f28c38' opacity='.7'/></svg></div></div><div><b>Texas law context</b><p>Texas does not generally require private employers to provide bereavement leave or bereavement pay. The written handbook controls eligibility, duration, pay, and approval requirements.</p><small>Source: TWC Texas Payday Law fringe-benefit framework</small></div></aside></div>\n", "notes": "Bereavement leave is a TCEA benefit. The handbook provides up to five consecutive paid days for listed immediate-family relationships and two paid days for listed extended-family relationships. Requests should be made to the Executive Director. The handbook also says that if an employee leaves work early on the day they are notified of the death, that day does not count as bereavement leave. Texas does not generally require private employers to offer bereavement leave or bereavement pay. That means the practical rule is the written handbook language: who qualifies, how many days apply, and how the request is made."}, {"bg": "light", "title": "Jury + Witness Leave", "html": "\n<div class='two'><div><p class='eyebrow'>Jury duty and witness leave</p><h2>TCEA pays jury duty even though Texas generally does not require private jury-duty pay.</h2><div class='cards compact'><article><b>Jury duty</b><p>TCEA continues pay during jury service, and employees may keep the court allowance.</p></article><article><b>Witness leave</b><p>Unpaid time off if summoned to appear as a witness.</p></article><article><b>Proof required</b><p>Submit the summons as soon as received and proof of service afterward.</p></article><article><b>No adverse action</b><p>The handbook states no adverse action for juror or witness service.</p></article></div></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='42' y='72' width='156' height='100' rx='18' fill='white' stroke='#0e1b2a' stroke-width='8'/><circle cx='88' cy='111' r='18' fill='#2f8f8a'/><circle cx='120' cy='111' r='18' fill='#2f8f8a' opacity='.75'/><circle cx='152' cy='111' r='18' fill='#2f8f8a' opacity='.5'/><path d='M66 151c20-26 88-26 108 0' stroke='#0e1b2a' stroke-width='10' fill='none' stroke-linecap='round'/><path d='M70 50h100' stroke='#0e1b2a' stroke-width='10' stroke-linecap='round'/></svg></div></div><div><b>Texas law context</b><p>Texas protects jury service from discharge or other adverse action, but generally does not require private employers to pay jury-duty time. Texas also prohibits penalizing an employee for complying with a valid subpoena.</p><small>Sources: TWC Jury Duty; Texas Labor Code §52.051</small></div></aside></div>\n", "notes": "Jury and witness leave has a direct legal overlay. TCEA continues pay during jury service, which is more generous than the general Texas private-employer requirement. The employee may also keep the court allowance. Witness duty is unpaid under the handbook. For either jury or witness service, the employee must submit the summons as soon as it is received and provide proof of service afterward. Texas protects jury service from termination or adverse action, and Texas Labor Code section 52.051 protects employees who comply with a valid subpoena. So the legal floor protects the absence, while TCEA’s policy defines the pay treatment."}, {"bg": "light", "title": "Workers’ Compensation + Disability", "html": "\n<div class='split-illus'><div><p class='eyebrow'>Injury, illness, and disability</p><h2>Work-related injuries must be reported immediately.</h2><ul class='biglist'><li>TCEA provides workers’ compensation insurance or coverage based on state regulations.</li><li>Medical expenses and partial salary payments follow applicable state law.</li><li>Employees must immediately report work-related injury or illness to the Executive Director.</li><li>Short-term disability requires exhaustion of sick leave and vacation first.</li></ul></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><path d='M120 36l72 28v48c0 44-28 78-72 102c-44-24-72-58-72-102V64z' fill='#2f8f8a'/><path d='M84 122l26 26l52-62' fill='none' stroke='white' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/><circle cx='178' cy='62' r='14' fill='#f28c38'/></svg></div></div><div><b>Texas law context</b><p>Texas workers’ compensation provides pay and medical benefits for covered work-related injuries or illnesses. Not every Texas employer carries coverage, but TCEA’s handbook says employees are covered.</p><small>Source: Texas Department of Insurance, Division of Workers’ Compensation</small></div></aside></div>\n", "notes": "For work-related injuries or illnesses, the handbook tells employees to report immediately to the Executive Director. TCEA says employees are covered by workers’ compensation insurance or based on state regulations. Medical expenses and partial salary payments are handled under applicable state law. The immediate reporting rule matters because delayed reporting can delay the filing of workers’ compensation reports and benefits. The handbook also includes short-term and long-term disability coverage. For disability coverage, employees must exhaust sick leave and vacation benefits before disability leave coverage applies. The Texas legal context is that workers’ compensation is a state-managed insurance system providing pay and medical benefits for covered work-related injuries."}, {"bg": "light", "title": "Voting Leave", "html": "\n<div class='two'><div><p class='eyebrow'>Voting</p><h2>TCEA’s voting policy tracks the Texas rule closely.</h2><div class='stat'><span>Up to 2 hours</span><p>Paid time off if the employee cannot reach the polling place outside work hours. Evidence of voting may be required.</p></div></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='52' y='96' width='136' height='92' rx='18' fill='white' stroke='#f28c38' stroke-width='8'/><path d='M82 96l38-50l38 50' fill='none' stroke='#2f8f8a' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/><path d='M92 134l20 20l40-48' fill='none' stroke='#f28c38' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/><path d='M76 188h88' stroke='#2f8f8a' stroke-width='10' stroke-linecap='round'/></svg></div></div><div><b>Texas law context</b><p>Texas requires employers to provide at least two hours off to vote on election day unless the employee already has two consecutive nonworking hours while polls are open. The time is paid to the extent it cuts into normal work hours.</p><small>Source: TWC Voting — Time Off</small></div></aside></div>\n", "notes": "Voting leave is one place where the handbook and Texas rule align closely. TCEA permits employees to be absent from work to vote in local, state, or national elections. Employees who cannot reach their polling place outside work hours are allowed paid time off to vote, not exceeding two hours. TCEA may require evidence of voting. TWC’s guidance similarly says employees should have at least two hours off to vote on election day unless they already have enough time outside work, and that time is paid to the extent it cuts into normal working hours. This is a legal requirement, not just a discretionary benefit."}, {"bg": "light", "title": "Emergency Closings", "html": "\n<div class='split-illus'><div><p class='eyebrow'>Weather, utility failure, emergency closing</p><h2>TCEA decides whether the office closes.</h2><p class='lead small'>The handbook gives TCEA sole discretion to close offices for inclement weather, power or utility failure, fire, flood, earthquake, or another emergency. Supervisors advise employees on procedures.</p></div><aside class='lawbox'><div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><path d='M70 152h94c24 0 42-16 42-38s-18-38-42-38c-7 0-13 1-19 4C134 57 111 46 88 52C61 59 48 80 52 104C34 107 22 121 22 139c0 18 16 13 48 13z' fill='white' stroke='#2f8f8a' stroke-width='8'/><path d='M86 168l-10 24M124 168l-10 24M162 168l-10 24' stroke='#8ab8e6' stroke-width='9' stroke-linecap='round'/><circle cx='182' cy='55' r='17' fill='#8ab8e6' opacity='.7'/></svg></div></div><div><b>Texas law context</b><p>Texas does not create a general bad-weather paid-leave rule for private employers. TWC guidance treats pay and use of paid leave during bad weather as a matter of wage-hour rules and the employer’s paid-leave policy.</p><small>Source: TWC Bad Weather — Pay and Attendance Issues</small></div></aside></div>\n", "notes": "Emergency office closing is mostly a policy and operations item. TCEA states that offices are normally open during regular working hours and that the Association has sole discretion to determine if offices close for weather, power failure, utility failure, fire, flood, earthquake, or another emergency. The supervisor advises employees about procedures when closures or emergencies arise. Texas does not create a general private-sector right to paid time off for bad weather. The legal analysis usually depends on whether the employee is exempt or nonexempt, whether work was performed, and what the written paid-leave policy allows."}, {"bg": "light", "title": "Best-Practice Checklist", "html": "\n<div class='two'><div><p class='eyebrow'>Employee checklist</p><h2>Before taking time away, match the reason to the rule.</h2><div class='checklist'><p>□ Is the absence planned, unexpected, legally protected, or discretionary?</p><p>□ Who must approve it: supervisor or Executive Director?</p><p>□ Is written notice required? Is there a deadline?</p><p>□ Is the time paid, unpaid, or paid only after accrued leave is used?</p><p>□ Does documentation apply: medical note, military orders, summons, proof of service, voting evidence?</p><p>□ Does the absence affect accrual, benefits, overtime, payout, or return-to-work clearance?</p></div></div><div class='illo' aria-hidden='true'><svg viewBox='0 0 240 240' role='img'><rect x='58' y='42' width='124' height='154' rx='20' fill='white' stroke='#2f8f8a' stroke-width='8'/><rect x='88' y='28' width='64' height='36' rx='14' fill='#f28c38'/><path d='M84 100h72M84 132h72M84 164h46' stroke='#2f8f8a' stroke-width='9' stroke-linecap='round'/><path d='M73 100l10 10l18-22' stroke='#f28c38' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg></div></div>\n", "notes": "This checklist turns the deck into a practical tool. Before taking time away, first identify the reason for the absence. Planned vacation, personal days, bereavement, military leave, jury service, witness duty, illness, workers’ compensation, voting, and emergency closures do not all work the same way. Then identify who must approve the request and whether written notice is required. Next, determine whether the time is paid, unpaid, or paid only after accrued leave is used. Finally, check whether documentation is required. The safest approach is to preserve the paper trail: request early, notify promptly, and keep proof for absences that depend on law or documentation."}, {"bg": "dark", "title": "Sources + Caution", "html": "\n<section class='hero'><p class='eyebrow'>Use with care</p><h1>This is an explainer, not legal advice.</h1><p class='lead'>For a real employment decision, check the current handbook, the exact facts, and legal counsel or TWC guidance.</p><div class='source-grid'><div><b>TCEA source</b><p>Employee Handbook 2026–2027: attendance, leave of absence, holidays, vacation, sick/personal days, voting, workers’ compensation, disability.</p></div><div><b>Texas / federal sources used</b><p>TWC Texas Payday Law; TWC Fringe Benefits; TWC Vacation/Sick/Parental Leave; TWC Holiday Policies; TWC Jury Duty; TWC Voting; TWC Attendance; DOL FMLA; DOL USERRA; Texas Department of Insurance workers’ compensation.</p></div></div></section>\n", "notes": "The closing point is caution. This deck is useful as a plain-language explainer, but it is not legal advice. Employment questions are fact-specific. The outcome can depend on employee status, exempt or nonexempt classification, employer size, FMLA coverage, whether the absence is legally protected, what the employee submitted, and the exact wording of the current handbook. The most important practical takeaway is that written policies matter in Texas. TCEA’s handbook often provides more than the Texas legal floor, but the specific conditions in the handbook, such as notice, approval, carryover, and payout rules, still need to be followed."}];
let i=0, presenter=false, start=Date.now();
const bc = new BroadcastChannel('tcea-leave-webdeck');
const root=document.getElementById('slides'), dots=document.getElementById('dots'), notes=document.getElementById('notes'), counter=document.getElementById('counter'), progress=document.getElementById('progress');
function render(){root.innerHTML=SLIDES.map((s,idx)=>`<main class="slide ${s.bg||'light'} ${idx===i?'active':''}" data-idx="${idx}">${s.html}</main>`).join('');dots.innerHTML=SLIDES.map((s,idx)=>`<button class="dot ${idx===i?'active':''}" aria-label="Slide ${idx+1}" onclick="go(${idx})"></button>`).join('');counter.textContent=(i+1)+' / '+SLIDES.length;progress.style.width=((i+1)/SLIDES.length*100)+'%';notes.innerHTML=`<h3>${SLIDES[i].title}</h3><p>${SLIDES[i].notes}</p>`;location.hash = '#'+(i+1);document.title=SLIDES[i].title+' - TCEA Leave WebDeck';bc.postMessage({type:'goto',i}); if(presenter) renderPresenter();}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));render()}function next(){go(i+1)}function prev(){go(i-1)}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.getElementById('notesBtn').onclick=()=>notes.classList.toggle('open');document.getElementById('helpBtn').onclick=()=>document.getElementById('help').classList.add('open');document.getElementById('presentBtn').onclick=openPresenter;
document.getElementById('help').onclick=e=>{if(e.target.id==='help')e.currentTarget.classList.remove('open')};
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown')next(); if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev(); if(e.key==='Home')go(0); if(e.key==='End')go(SLIDES.length-1); if(e.key.toLowerCase()==='n')notes.classList.toggle('open'); if(e.key.toLowerCase()==='f')document.getElementById('fs').click(); if(e.key.toLowerCase()==='h')document.getElementById('help').classList.toggle('open'); if(e.key.toLowerCase()==='p')openPresenter(); if(e.key==='Escape'){notes.classList.remove('open');document.getElementById('help').classList.remove('open')}});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10); if(n&&!isNaN(n)&&n-1!==i)go(n-1)});
document.addEventListener('click',e=>{if(presenter||notes.classList.contains('open')||document.getElementById('help').classList.contains('open'))return;if(e.target.closest('a,button,.nav,.panel,.help'))return;if(String(window.getSelection()))return;const x=e.clientX/window.innerWidth;if(x<.33)prev();else if(x>.66)next();});
let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>55){dx<0?next():prev()}},{passive:true});
bc.onmessage=e=>{if(e.data.type==='goto'&&e.data.i!==i){i=e.data.i;render()}};
function openPresenter(){const w=window.open(location.href+'?audience=1#'+(i+1),'tceaAudience'); if(!w) alert('Allow pop-ups to use presenter view.'); presenter=true;document.body.innerHTML='<div id="presenter" class="presenter"></div>';renderPresenter();}
function renderPresenter(){const p=document.getElementById('presenter'); if(!p)return; const elapsed=Math.floor((Date.now()-start)/1000); const m=String(Math.floor(elapsed/60)).padStart(2,'0'), s=String(elapsed%60).padStart(2,'0'); p.innerHTML=`<div class="timer">${m}:${s}</div><h1 style="font-size:3rem">${SLIDES[i].title}</h1><div class="presenter-grid"><section class="mini"><h2>Current</h2>${SLIDES[i].html}</section><section class="mini"><h2>Notes</h2><p>${SLIDES[i].notes}</p><h2>Next</h2><p>${SLIDES[i+1]?.title||'End'}</p></section></div>`}
setInterval(()=>{if(presenter)renderPresenter()},1000);
const startHash=parseInt(location.hash.slice(1),10); if(startHash) i=Math.max(0,Math.min(SLIDES.length-1,startHash-1)); render();
</script></body></html>
